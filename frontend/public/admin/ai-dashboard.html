  <style>
    :root {
      --bg-deep: #050308;
      --bg-primary: #08080d;
      --bg-surface: rgba(8, 12, 25, 0.85);
      --bg-card: rgba(16, 16, 24, 0.75);
      --glass-edge: rgba(0, 247, 255, 0.2);
      --glass-edge-gold: rgba(214, 178, 94, 0.2);
      --neon-cyan: #00f7ff;
      --neon-purple: #b200ff;
      --neon-gold: #ffd966;
      --gold-soft: #c4a04a;
      --gold-bright: #e8c97a;
      --accent-danger: #ff3366;
      --accent-success: #33ffaa;
      --accent-warning: #ffaa33;
      --text-primary: #f0f3ff;
      --text-secondary: #9ca3cf;
      --text-muted: #6a6870;
      --gradient-primary: linear-gradient(135deg, #00f7ff, #b200ff);
      --gradient-gold: linear-gradient(135deg, #ffd966, #ffaa33);
      --shadow-glow: 0 0 20px rgba(0,247,255,0.3);
      --shadow-gold: 0 0 30px rgba(214,178,94,0.15);
      --radius-card: 1.2rem;
      --radius-sm: 0.8rem;
      --transition-smooth: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      --transition-bounce: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Ambient Background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse 60% 40% at 20% 0%, rgba(214,178,94,0.04) 0%, transparent 50%),
        radial-gradient(ellipse 50% 35% at 80% 100%, rgba(0,247,255,0.03) 0%, transparent 50%),
        radial-gradient(ellipse 40% 30% at 50% 50%, rgba(178,0,255,0.02) 0%, transparent 60%);
      pointer-events: none;
      z-index: -2;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(214,178,94,0.015) 1px, transparent 1px);
      background-size: 35px 35px;
      pointer-events: none;
      z-index: -1;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 10%, transparent 55%);
    }

    /* Floating Orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(65px);
      pointer-events: none;
      z-index: -1;
      animation: orbFloat 20s ease-in-out infinite alternate;
    }
    .orb-1 {
      width: 45vw; height: 45vw;
      background: radial-gradient(circle, rgba(214,178,94,0.10), transparent);
      top: -20vh; right: -15vw;
    }
    .orb-2 {
      width: 35vw; height: 35vw;
      background: radial-gradient(circle, rgba(0,247,255,0.06), transparent);
      bottom: -15vh; left: -12vw;
      animation-duration: 25s;
    }
    @keyframes orbFloat {
      0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
      50% { transform: translate(3%, -4%) scale(1.1); opacity: 0.5; }
      100% { transform: translate(-2%, 2%) scale(0.95); opacity: 0.35; }
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg-deep); }
    ::-webkit-scrollbar-thumb { background: var(--neon-gold); border-radius: 3px; }
    ::selection { background: rgba(214,178,94,0.3); color: var(--text-primary); }

    /* ===== HEADER ===== */
    .header {
      background: rgba(8, 12, 25, 0.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-edge-gold);
      padding: 0.8rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .header-left .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, rgba(214,178,94,0.2), rgba(214,178,94,0.05));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: var(--neon-gold);
      border: 1px solid rgba(214,178,94,0.15);
    }

    .header-left h1 {
      font-family: 'Orbitron', monospace;
      font-size: 1.2rem;
      background: var(--gradient-gold);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .header-left .subtitle {
      font-size: 0.65rem;
      color: var(--text-secondary);
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.3rem 1rem;
      border-radius: 2rem;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .status-active {
      background: rgba(51, 255, 170, 0.1);
      border: 1px solid rgba(51, 255, 170, 0.3);
      color: var(--accent-success);
    }

    .status-inactive {
      background: rgba(255, 51, 102, 0.1);
      border: 1px solid rgba(255, 51, 102, 0.3);
      color: var(--accent-danger);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-success);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(51,255,170,0.4); }
      50% { opacity: 0.4; box-shadow: 0 0 0 8px rgba(51,255,170,0); }
    }

    /* Buttons */
    .btn {
      padding: 0.5rem 1.2rem;
      border-radius: 2rem;
      font-weight: 600;
      font-size: 0.75rem;
      cursor: pointer;
      border: none;
      transition: var(--transition-smooth);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      font-family: 'Inter', sans-serif;
    }

    .btn-primary {
      background: var(--gradient-primary);
      color: white;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(0,247,255,0.4); }

    .btn-gold {
      background: var(--gradient-gold);
      color: #000;
    }
    .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(214,178,94,0.4); }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--glass-edge-gold);
      color: var(--neon-gold);
    }
    .btn-outline:hover { background: rgba(214,178,94,0.08); border-color: var(--neon-gold); }

    .btn-danger {
      background: rgba(255, 51, 102, 0.15);
      border: 1px solid rgba(255, 51, 102, 0.3);
      color: var(--accent-danger);
    }
    .btn-danger:hover { background: var(--accent-danger); color: white; }

    .btn-sm { padding: 0.3rem 0.8rem; font-size: 0.65rem; }

    /* ===== CONTAINER ===== */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.2rem;
    }

    /* ===== METRICS GRID ===== */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0.8rem;
      margin-bottom: 1.2rem;
    }

    .metric-card {
      background: var(--bg-surface);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-edge-gold);
      border-radius: var(--radius-card);
      padding: 1.2rem;
      transition: var(--transition-smooth);
    }

    .metric-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-gold);
      border-color: rgba(214,178,94,0.3);
    }

    .metric-card .metric-icon {
      font-size: 1.3rem;
      margin-bottom: 0.3rem;
    }

    .metric-card .metric-value {
      font-size: 1.6rem;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      color: var(--neon-gold);
    }

    .metric-card .metric-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
    }

    .metric-card .metric-change {
      font-size: 0.7rem;
      margin-top: 0.4rem;
    }

    .metric-change.positive { color: var(--accent-success); }
    .metric-change.negative { color: var(--accent-danger); }
    .metric-change.neutral { color: var(--text-secondary); }

    /* ===== INSIGHTS GRID ===== */
    .insights-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
      gap: 0.8rem;
      margin-bottom: 1.2rem;
    }

    .insight-card {
      background: var(--bg-surface);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-edge-gold);
      border-radius: var(--radius-card);
      padding: 1.2rem;
      transition: var(--transition-smooth);
    }

    .insight-card:hover {
      border-color: rgba(214,178,94,0.3);
    }

    .insight-card.critical { border-left: 4px solid var(--accent-danger); }
    .insight-card.warning { border-left: 4px solid var(--accent-warning); }
    .insight-card.success { border-left: 4px solid var(--accent-success); }
    .insight-card.info { border-left: 4px solid var(--neon-cyan); }
    .insight-card.gold { border-left: 4px solid var(--neon-gold); }

    .insight-card h3 {
      font-size: 0.85rem;
      color: var(--neon-gold);
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .insight-item {
      padding: 0.7rem;
      margin-bottom: 0.5rem;
      background: rgba(255, 255, 255, 0.02);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition-smooth);
      border: 1px solid transparent;
    }

    .insight-item:hover {
      background: rgba(214,178,94,0.05);
      border-color: rgba(214,178,94,0.15);
      transform: translateX(4px);
    }

    .insight-item .insight-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.2rem;
    }

    .insight-item .insight-title {
      font-weight: 600;
      font-size: 0.8rem;
    }

    .insight-item .insight-badge {
      padding: 0.1rem 0.6rem;
      border-radius: 1rem;
      font-size: 0.6rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-critical { background: rgba(255, 51, 102, 0.2); color: var(--accent-danger); }
    .badge-warning { background: rgba(255, 170, 51, 0.2); color: var(--accent-warning); }
    .badge-success { background: rgba(51, 255, 170, 0.2); color: var(--accent-success); }
    .badge-info { background: rgba(0, 247, 255, 0.2); color: var(--neon-cyan); }
    .badge-gold { background: rgba(214, 178, 94, 0.2); color: var(--neon-gold); }
    .badge-high { background: rgba(255, 51, 102, 0.2); color: var(--accent-danger); }
    .badge-medium { background: rgba(255, 170, 51, 0.2); color: var(--accent-warning); }
    .badge-low { background: rgba(0, 247, 255, 0.2); color: var(--neon-cyan); }

    .insight-item .insight-description {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-bottom: 0.3rem;
    }

    .insight-item .insight-meta {
      display: flex;
      gap: 0.8rem;
      font-size: 0.65rem;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    /* ===== CHARTS ROW ===== */
    .charts-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
      gap: 0.8rem;
      margin-bottom: 1.2rem;
    }

    .chart-box {
      background: var(--bg-surface);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-edge-gold);
      border-radius: var(--radius-card);
      padding: 1.2rem;
    }

    .chart-box h3 {
      font-size: 0.85rem;
      color: var(--neon-gold);
      margin-bottom: 0.8rem;
    }

    /* ===== DATA PANEL ===== */
    .data-panel {
      background: var(--bg-surface);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-edge-gold);
      border-radius: var(--radius-card);
      padding: 1.2rem;
      margin-bottom: 1.2rem;
      overflow-x: auto;
    }

    .data-panel h3 {
      font-size: 0.85rem;
      color: var(--neon-gold);
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75rem;
    }

    th, td {
      padding: 0.6rem 0.8rem;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    th {
      color: var(--neon-gold);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: 0.6rem;
    }

    tr:hover td {
      background: rgba(214,178,94,0.03);
    }

    /* ===== QUICK LINKS BAR ===== */
    .quick-links-bar {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
      padding: 0.8rem 1.2rem;
      background: var(--bg-surface);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-edge-gold);
      border-radius: var(--radius-card);
      margin-bottom: 1.2rem;
      align-items: center;
    }

    .quick-links-bar .label {
      font-size: 0.65rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .quick-link {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.75rem;
      padding: 0.3rem 0.8rem;
      border-radius: 2rem;
      transition: var(--transition-smooth);
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .quick-link:hover {
      color: var(--neon-gold);
      background: rgba(214,178,94,0.08);
    }

    .quick-link.active {
      color: var(--neon-gold);
      background: rgba(214,178,94,0.12);
      border: 1px solid rgba(214,178,94,0.2);
    }

    /* ===== LOADING ===== */
    .loading-overlay {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(214,178,94,0.2);
      border-top-color: var(--neon-gold);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ===== TOAST ===== */
    .toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .toast {
      padding: 0.8rem 1.5rem;
      border-radius: 1rem;
      color: white;
      font-weight: 600;
      font-size: 0.8rem;
      animation: toastSlide 0.3s ease;
      max-width: 400px;
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .toast-success { background: rgba(51, 255, 170, 0.9); color: #000; border-color: rgba(51,255,170,0.3); }
    .toast-error { background: rgba(255, 51, 102, 0.9); border-color: rgba(255,51,102,0.3); }
    .toast-info { background: rgba(0, 247, 255, 0.9); color: #000; border-color: rgba(0,247,255,0.3); }
    .toast-warning { background: rgba(255, 170, 51, 0.9); color: #000; border-color: rgba(255,170,51,0.3); }

    @keyframes toastSlide {
      from { opacity: 0; transform: translateX(100px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      text-align: center;
      padding: 2rem;
      color: var(--text-secondary);
    }

    .empty-state i {
      font-size: 3rem;
      margin-bottom: 1rem;
      color: var(--neon-gold);
      opacity: 0.3;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 1024px) {
      .charts-row { grid-template-columns: 1fr; }
    }

    @media (max-width: 768px) {
      .header { padding: 0.8rem 1rem; }
      .container { padding: 0.8rem; }
      .insights-grid { grid-template-columns: 1fr; }
      .metrics-grid { grid-template-columns: repeat(2, 1fr); }
      .header-left h1 { font-size: 1rem; }
      .header-left .subtitle { display: none; }
      .quick-links-bar { flex-wrap: wrap; }
    }

    @media (max-width: 480px) {
      .metrics-grid { grid-template-columns: 1fr; }
      .header-right { width: 100%; justify-content: flex-end; }
      .header-right .btn span { display: none; }
      .status-indicator span { display: none; }
    }
  </style>

  const DOM = {

      return localStorage.getItem(CONFIG.STORAGE_KEYS.TOKEN) ||
             localStorage.getItem('psh_auth_token') ||
             null;
  }

  function getUser() {

  // ================================================================ //
  // API HELPERS                                                      //
  // ================================================================ //

  async function refreshCsrf() {
      try {
          const fp = await getDeviceFingerprint();
          const res = await fetch(`${CONFIG.API_BASE}${CONFIG.ENDPOINTS.CSRF}`, {
              credentials: 'include',
              headers: { 'x-device-fingerprint': fp }
          });
          if (res.ok) {
              State.csrfToken = await res.text();
              const meta = document.querySelector('meta[name="csrf-token"]');
              if (meta) meta.setAttribute('content', State.csrfToken);
              return State.csrfToken;
          }
      } catch(e) {
          console.warn('CSRF refresh failed:', e);
      }
      return null;
  }

  async function apiRequest(endpoint, options = {}) {
      const token = getAuthToken();
      const fp = await getDeviceFingerprint();

      const headers = {
          'Content-Type': 'application/json',
          'Accept': 'application/json',
          'x-device-fingerprint': fp
      };

      if (token) {
          headers['Authorization'] = `Bearer ${token}`;
      }

      if (State.csrfToken && options.method && !['GET', 'HEAD'].includes(options.method)) {
          headers['x-csrf-token'] = State.csrfToken;
      }

      try {
          const res = await fetch(`${CONFIG.API_BASE}${endpoint}`, {
              ...options,
              headers: { ...headers, ...options.headers },
              credentials: 'include'
          });

          if (res.status === 403) {
              await refreshCsrf();
              const retryHeaders = { ...headers };
              if (State.csrfToken) {
                  retryHeaders['x-csrf-token'] = State.csrfToken;
              }
              const retry = await fetch(`${CONFIG.API_BASE}${endpoint}`, {
                  ...options,
                  headers: { ...retryHeaders, ...options.headers },
                  credentials: 'include'
              });
              if (!retry.ok) {
                  const err = await retry.json().catch(() => ({}));
                  throw new Error(err.error || err.message || `HTTP ${retry.status}`);
              }
              return retry.json();
          }

          if (res.status === 401) {
              try { if (auth.logout) auth.logout(); } catch(e) {}
              localStorage.removeItem(CONFIG.STORAGE_KEYS.TOKEN);
              localStorage.removeItem(CONFIG.STORAGE_KEYS.USER);
              window.location.href = '/admin-login.html';
              throw new Error('Session expired');
          }

          if (res.status === 429) {
              const retryAfter = res.headers.get('Retry-After') || 30;
              throw new Error(`Rate limited. Please wait ${retryAfter} seconds.`);
          }

          if (!res.ok) {
              const err = await res.json().catch(() => ({}));
              throw new Error(err.error || err.message || `HTTP ${res.status}`);
          }

          return res.json();
      } catch (error) {
          console.error(`API Error [${endpoint}]:`, error);
          throw error;
      }
  }

  // ================================================================ //

  async function checkAuth() {
      const token = getAuthToken();
      if (!token || !isAdmin()) {
          window.location.href = '/admin-login.html';
          return false;
      }

      try {
          const res = await apiRequest(CONFIG.ENDPOINTS.AUTH_CHECK);
          if (res.authenticated) {
              State.user = res.user || getUser();
              return true;
          }
          throw new Error('Not authenticated');
      } catch {
          window.location.href = '/admin-login.html';
          return false;
      }
  }

      return String(str)
          .replace(/&/g, '&amp;')

          .replace(/"/g, '&quot;')

      startAutoRefresh();

      // Handle visibility change
      document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') {
              refreshDashboard();
          }
      });

      console.log('âœ… AI Dashboard initialized');
      console.log('âŒ¨ï¸  Ctrl+R to refresh | Ctrl+Shift+A to run autonomous | Ctrl+Shift+L for Analytics');
      console.log('ðŸ”„ Auto-refresh: Enabled (every ' + (CONFIG.AUTO_REFRESH_INTERVAL / 1000) + 's)');
      console.log('ðŸ”— Analytics dashboard: /admin/analytics.html');
  }

  // Cleanup on page unload
  window.addEventListener('beforeunload', () => {
      if (State.refreshInterval) {
          clearInterval(State.refreshInterval);
          State.refreshInterval = null;
      }
  });

  // Expose functions globally
  window.refreshDashboard = refreshDashboard;
  window.runAutonomousSystem = runAutonomousSystem;
  window.logout = logout;

  // Start
  if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
  } else {
      init();
  }

</script>
</body>
</html>
