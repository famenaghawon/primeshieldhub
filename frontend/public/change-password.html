<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,user-scalable=yes">
<title>Change Password — PrimeShieldHub Franchise</title>
<meta name="robots" content="noindex,nofollow">
<link rel="canonical" href="https://primeshieldhub.com/franchise/change-password">
<link rel="icon" href="/favicon.png" type="image/png">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#060608;--card:#0f0f13;--gold:#d6b25e;--gold-2:#f3dba0;
    --text:#e8edff;--muted:#b8b6ad;--border:rgba(214,178,94,.3);
    --danger:#ff5577;--success:#3ddc84;--warn:#ffb300;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .wrap{width:100%;max-width:480px}
  .card{
    background:linear-gradient(135deg,#0f0f13 0%,#1a1a25 100%);
    border:1px solid var(--border);border-radius:20px;
    padding:40px 32px;box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .brand{
    text-align:center;margin-bottom:32px;
  }
  .brand h1{
    color:var(--gold-2);font-size:22px;font-weight:800;
    letter-spacing:2px;margin:0;
  }
  .brand h1 span{color:var(--gold)}
  .brand p{
    color:var(--muted);font-size:13px;margin-top:8px;
  }
  .badge{
    display:inline-block;background:rgba(255,179,0,.12);
    border:1px solid rgba(255,179,0,.35);color:var(--warn);
    padding:6px 14px;border-radius:50px;font-size:12px;
    font-weight:600;margin-bottom:24px;
  }
  h2{font-size:20px;margin-bottom:8px;color:var(--text)}
  .subtitle{color:var(--muted);font-size:14px;line-height:1.5;margin-bottom:24px}
  .field{margin-bottom:20px}
  .field label{
    display:block;color:var(--muted);font-size:12px;
    text-transform:uppercase;letter-spacing:1.5px;
    margin-bottom:8px;font-weight:600;
  }
  .field input{
    width:100%;background:rgba(0,0,0,.4);border:1px solid #2a2a35;
    border-radius:10px;color:var(--text);padding:14px 16px;
    font-size:15px;font-family:inherit;transition:border-color .2s;
  }
  .field input:focus{
    outline:none;border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(214,178,94,.15);
  }
  .strength{
    display:flex;gap:4px;margin-top:8px;
  }
  .strength .bar{
    flex:1;height:4px;background:#2a2a35;border-radius:2px;
    transition:background .2s;
  }
  .strength .bar.active.weak{background:#ff5577}
  .strength .bar.active.medium{background:#ffb300}
  .strength .bar.active.strong{background:#3ddc84}
  .strength-label{
    color:var(--muted);font-size:11px;margin-top:6px;
  }
  .alert{
    padding:14px 16px;border-radius:10px;font-size:14px;
    margin-bottom:20px;line-height:1.4;display:none;
  }
  .alert.show{display:block}
  .alert.error{
    background:rgba(255,85,119,.1);
    border:1px solid rgba(255,85,119,.35);color:#ffa0b5;
  }
  .alert.success{
    background:rgba(61,220,132,.1);
    border:1px solid rgba(61,220,132,.35);color:#a0ffcc;
  }
  button{
    width:100%;background:linear-gradient(135deg,#b8943c,#d6b25e);
    color:#0a0a0a;border:0;padding:16px;border-radius:12px;
    font-size:15px;font-weight:700;cursor:pointer;
    transition:transform .15s,box-shadow .2s;font-family:inherit;
    letter-spacing:.3px;
  }
  button:hover:not(:disabled){
    transform:translateY(-1px);
    box-shadow:0 8px 20px rgba(214,178,94,.25);
  }
  button:disabled{opacity:.5;cursor:not-allowed}
  .footer-links{
    text-align:center;margin-top:24px;
    display:flex;justify-content:center;gap:20px;
  }
  .footer-links a{
    color:var(--muted);font-size:13px;text-decoration:none;
    transition:color .2s;
  }
  .footer-links a:hover{color:var(--gold)}
  .loading{display:none;text-align:center;color:var(--muted);padding:10px}
  .loading.show{display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="brand">
      <h1>PRIME<span>SHIELD</span>HUB</h1>
      <p>Franchise Partner Portal</p>
    </div>

    <div class="badge">🔒 First Login — Action Required</div>

    <h2>Set Your Password</h2>
    <p class="subtitle">
      For security, you must set a new password before continuing.
      Your temporary password was only for initial access.
    </p>

    <div id="alert" class="alert"></div>

    <form id="form" autocomplete="off">
      <div class="field">
        <label for="currentPassword">Current Password</label>
        <input type="password" id="currentPassword" name="currentPassword"
               autocomplete="current-password" required>
      </div>

      <div class="field">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" name="newPassword"
               autocomplete="new-password" required minlength="8">
        <div class="strength" id="strength">
          <div class="bar"></div><div class="bar"></div>
          <div class="bar"></div><div class="bar"></div>
        </div>
        <div class="strength-label" id="strengthLabel">Minimum 8 characters</div>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm New Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword"
               autocomplete="new-password" required minlength="8">
      </div>

      <button type="submit" id="submitBtn">Change Password & Continue</button>
      <div class="loading" id="loading">Updating your password...</div>
    </form>

    <div class="footer-links">
      <a href="/franchise/dashboard">← Back</a>
      <a href="#" id="logoutLink">Log out</a>
    </div>
  </div>
</div>

<script>
(function(){
  var API = 'https://api.primeshieldhub.com';
  var form = document.getElementById('form');
  var currentPw = document.getElementById('currentPassword');
  var newPw = document.getElementById('newPassword');
  var confirmPw = document.getElementById('confirmPassword');
  var submitBtn = document.getElementById('submitBtn');
  var loading = document.getElementById('loading');
  var alertBox = document.getElementById('alert');
  var strengthBars = document.querySelectorAll('#strength .bar');
  var strengthLabel = document.getElementById('strengthLabel');

  function getToken(){
    return localStorage.getItem('psh_auth_token') || '';
  }

  function showAlert(msg, type){
    alertBox.textContent = msg;
    alertBox.className = 'alert show ' + type;
  }
  function hideAlert(){
    alertBox.className = 'alert';
  }

  function scorePassword(pw){
    if (!pw) return 0;
    var score = 0;
    if (pw.length >= 8) score++;
    if (pw.length >= 12) score++;
    if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) score++;
    if (/\d/.test(pw) && /[^A-Za-z0-9]/.test(pw)) score++;
    return Math.min(score, 4);
  }

  newPw.addEventListener('input', function(){
    var score = scorePassword(newPw.value);
    strengthBars.forEach(function(bar, i){
      bar.className = 'bar' + (i < score ? ' active ' + (score <= 2 ? 'weak' : score === 3 ? 'medium' : 'strong') : '');
    });
    var labels = ['Minimum 8 characters','Weak','Fair','Good','Strong'];
    strengthLabel.textContent = labels[score];
  });

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    hideAlert();

    if (newPw.value !== confirmPw.value){
      showAlert('New passwords do not match.', 'error');
      return;
    }
    if (newPw.value.length < 8){
      showAlert('Password must be at least 8 characters.', 'error');
      return;
    }

    submitBtn.disabled = true;
    loading.classList.add('show');

    try {
      var res = await fetch(API + '/api/franchise/change-password', {
        method: 'POST',
        credentials: 'include',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + getToken()
        },
        body: JSON.stringify({
          currentPassword: currentPw.value,
          newPassword: newPw.value,
          confirmPassword: confirmPw.value
        })
      });

      var data = await res.json();

      if (!res.ok || !data.success){
        showAlert(data.error || 'Could not change password. Please try again.', 'error');
        submitBtn.disabled = false;
        loading.classList.remove('show');
        return;
      }

      showAlert('✅ Password updated! Redirecting to your dashboard...', 'success');
      setTimeout(function(){
        window.location.href = '/franchise/dashboard';
      }, 1200);
    } catch (err){
      showAlert('Network error. Please check your connection and try again.', 'error');
      submitBtn.disabled = false;
      loading.classList.remove('show');
    }
  });

  document.getElementById('logoutLink').addEventListener('click', async function(e){
    e.preventDefault();
    try {
      await fetch(API + '/api/franchise/logout', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Authorization': 'Bearer ' + getToken() }
      });
    } catch(_){}
    localStorage.removeItem('psh_auth_token');
    localStorage.removeItem('psh_user');
    window.location.href = '/franchise/login';
  });
})();
</script>
</body>
</html>
