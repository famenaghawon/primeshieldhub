<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrimeShieldHub · Admin Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ============================================================
           ROOT VARIABLES & RESET
           ============================================================ */
        :root {
            --bg-primary: #070b17;
            --bg-secondary: #0e1428;
            --bg-panel: #141c3a;
            --bg-card: #1a2248;
            --bg-input: #0a0f24;
            --border-color: #2a3a7a;
            --text-primary: #eef3ff;
            --text-secondary: #a8b5e0;
            --text-muted: #6a7aaa;
            --neon-cyan: #00f0ff;
            --neon-gold: #ffd866;
            --neon-purple: #b388ff;
            --neon-green: #00e676;
            --neon-red: #ff6b6b;
            --radius: 16px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* ============================================================
           ANIMATED 3D BACKGROUND
           ============================================================ */
        .bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bg-canvas .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: floatOrb 20s ease-in-out infinite alternate;
        }

        .bg-canvas .orb:nth-child(1) {
            width: 600px;
            height: 600px;
            top: -200px;
            right: -200px;
            background: radial-gradient(circle, var(--neon-cyan), transparent 70%);
            animation-duration: 25s;
        }

        .bg-canvas .orb:nth-child(2) {
            width: 500px;
            height: 500px;
            bottom: -150px;
            left: -150px;
            background: radial-gradient(circle, var(--neon-purple), transparent 70%);
            animation-duration: 30s;
            animation-delay: -5s;
        }

        .bg-canvas .orb:nth-child(3) {
            width: 300px;
            height: 300px;
            top: 40%;
            left: 50%;
            background: radial-gradient(circle, var(--neon-gold), transparent 70%);
            animation-duration: 18s;
            animation-delay: -10s;
            opacity: 0.08;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            25% { transform: translate(60px, -40px) scale(1.1) rotate(5deg); }
            50% { transform: translate(-30px, 60px) scale(0.9) rotate(-3deg); }
            75% { transform: translate(40px, 30px) scale(1.05) rotate(4deg); }
            100% { transform: translate(-20px, -50px) scale(0.95) rotate(-2deg); }
        }

        /* Grid overlay */
        .bg-canvas .grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 40s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, 60px); }
        }

        /* ============================================================
           LOGIN CONTAINER — 3D CARD
           ============================================================ */
        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            perspective: 1200px;
        }

        .login-card {
            background: rgba(20, 28, 58, 0.75);
            backdrop-filter: blur(24px) saturate(1.4);
            border: 1px solid rgba(42, 58, 122, 0.3);
            border-radius: var(--radius);
            padding: 44px 40px 36px;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.6),
                0 0 60px rgba(0, 240, 255, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
            transform: rotateX(2deg) rotateY(-1deg) translateZ(0);
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: var(--radius);
            padding: 1px;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), transparent 40%, transparent 60%, rgba(179, 136, 255, 0.2));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .login-card:hover {
            transform: rotateX(1deg) rotateY(0deg) translateY(-4px) scale(1.005);
            box-shadow:
                0 40px 100px rgba(0, 0, 0, 0.7),
                0 0 80px rgba(0, 240, 255, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        /* Glow edge animation */
        .login-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(0, 240, 255, 0.03), transparent, rgba(179, 136, 255, 0.03), transparent);
            animation: borderGlow 8s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes borderGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .login-card > * {
            position: relative;
            z-index: 1;
        }

        /* ============================================================
           BRAND
           ============================================================ */
        .login-brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-brand .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            font-size: 30px;
            color: #000;
            margin-bottom: 12px;
            box-shadow: 0 12px 40px rgba(0, 240, 255, 0.15);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .login-brand .logo-icon:hover {
            transform: scale(1.05) rotate(-3deg);
            box-shadow: 0 16px 56px rgba(0, 240, 255, 0.25);
        }

        .login-brand h1 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .login-brand .tagline {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 2px;
            letter-spacing: 0.3px;
        }

        .login-brand .tagline i {
            color: var(--neon-green);
            margin-right: 4px;
        }

        /* ============================================================
           AUTH TOGGLE — 3D SEGMENTED
           ============================================================ */
        .auth-toggle {
            display: flex;
            gap: 4px;
            background: var(--bg-input);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .auth-toggle .slider {
            position: absolute;
            top: 4px;
            bottom: 4px;
            width: calc(50% - 4px);
            background: linear-gradient(135deg, var(--neon-cyan), #0098b0);
            border-radius: 10px;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 20px rgba(0, 240, 255, 0.2);
            z-index: 0;
        }

        .auth-toggle .slider.right {
            transform: translateX(100%);
        }

        .auth-toggle button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            z-index: 1;
        }

        .auth-toggle button.active {
            color: #000;
        }

        .auth-toggle button:hover:not(.active) {
            color: var(--text-secondary);
        }

        /* ============================================================
           FORMS
           ============================================================ */
        .form-section {
            display: none;
            animation: fadeSlide 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .form-section.active {
            display: block;
        }

        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(16px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .form-section h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .form-section .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 22px;
        }

        /* ============================================================
           FORM ELEMENTS — 3D STYLE
           ============================================================ */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .form-group .input-wrap {
            position: relative;
            transition: transform 0.2s ease;
        }

        .form-group .input-wrap:focus-within {
            transform: scale(1.01);
        }

        .form-group .input-wrap i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 15px;
            pointer-events: none;
            transition: color 0.3s ease;
        }

        .form-group .input-wrap:focus-within i {
            color: var(--neon-cyan);
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px 14px 46px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 15px;
            transition: var(--transition);
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 0 4px rgba(0, 240, 255, 0.08), inset 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
            opacity: 0.5;
        }

        /* ============================================================
           PASSWORD TOGGLE — FULLY CLICKABLE FIXED
           ============================================================ */
        .form-group .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 18px;
            padding: 8px 10px;
            transition: all 0.3s ease;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            min-width: 38px;
            min-height: 38px;
        }

        .form-group .toggle-password:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.06);
        }

        .form-group .toggle-password:active {
            transform: translateY(-50%) scale(0.92);
        }

        .form-group .toggle-password i {
            pointer-events: none;
            font-size: 18px;
        }

        /* ============================================================
           BUTTONS — 3D WITH RIPPLE
           ============================================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 20px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.1) 0%, transparent 60%);
            pointer-events: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--neon-cyan), #0098b0);
            color: #000;
            box-shadow: 0 8px 32px rgba(0, 240, 255, 0.2);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 12px 48px rgba(0, 240, 255, 0.35);
        }

        .btn-primary:active:not(:disabled) {
            transform: scale(0.97);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--neon-gold), #f5b800);
            color: #000;
            box-shadow: 0 8px 32px rgba(255, 216, 102, 0.2);
        }

        .btn-gold:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 12px 48px rgba(255, 216, 102, 0.35);
        }

        .btn-gold:active:not(:disabled) {
            transform: scale(0.97);
        }

        .btn-gold:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Ripple effect */
        .btn .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            transform: scale(0);
            animation: rippleAnim 0.6s ease-out forwards;
            pointer-events: none;
        }

        @keyframes rippleAnim {
            to { transform: scale(4); opacity: 0; }
        }

        /* ============================================================
           MESSAGE — 3D TOAST
           ============================================================ */
        .message {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
            animation: fadeSlide 0.3s ease;
            border-left: 4px solid transparent;
            backdrop-filter: blur(8px);
        }

        .message.error {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 107, 107, 0.08);
            border: 1px solid rgba(255, 107, 107, 0.15);
            color: var(--neon-red);
            border-left-color: var(--neon-red);
        }

        .message.success {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 230, 118, 0.08);
            border: 1px solid rgba(0, 230, 118, 0.15);
            color: var(--neon-green);
            border-left-color: var(--neon-green);
        }

        .message.info {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 240, 255, 0.06);
            border: 1px solid rgba(0, 240, 255, 0.1);
            color: var(--neon-cyan);
            border-left-color: var(--neon-cyan);
        }

        .message i {
            font-size: 18px;
        }

        /* ============================================================
           SPINNER
           ============================================================ */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(0, 0, 0, 0.15);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ============================================================
           FOOTER
           ============================================================ */
        .footer-links {
            margin-top: 22px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.3s ease;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .footer-links a:hover {
            color: var(--neon-cyan);
            background: rgba(0, 240, 255, 0.06);
        }

        .footer-links .divider {
            color: var(--border-color);
        }

        /* ============================================================
           REGISTRATION CODE — DYNAMIC
           ============================================================ */
        .reg-code-field {
            display: none;
        }

        .reg-code-field.show {
            display: block;
            animation: fadeSlide 0.3s ease;
        }

        .reg-code-field .hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* ============================================================
           PASSWORD STRENGTH INDICATOR
           ============================================================ */
        .password-strength {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            height: 4px;
        }

        .password-strength .bar {
            flex: 1;
            border-radius: 4px;
            background: var(--border-color);
            transition: background 0.4s ease, transform 0.2s ease;
        }

        .password-strength .bar.active.weak { background: var(--neon-red); }
        .password-strength .bar.active.medium { background: var(--neon-gold); }
        .password-strength .bar.active.strong { background: var(--neon-green); }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 520px) {
            .login-card {
                padding: 28px 20px 24px;
                transform: none !important;
            }

            .login-brand .logo-icon {
                width: 52px;
                height: 52px;
                font-size: 24px;
            }

            .login-brand h1 {
                font-size: 22px;
            }

            .auth-toggle button {
                font-size: 13px;
                padding: 8px;
            }

            .form-group input {
                padding: 12px 14px 12px 40px;
                font-size: 14px;
            }

            .footer-links {
                gap: 10px;
                font-size: 12px;
            }
        }

        @media (max-width: 380px) {
            .login-card {
                padding: 20px 14px 18px;
            }
            .login-brand .logo-icon {
                width: 44px;
                height: 44px;
                font-size: 20px;
            }
            .btn {
                font-size: 14px;
                padding: 12px 16px;
            }
        }

        /* ============================================================
           ACCESSIBILITY — REDUCED MOTION
           ============================================================ */
        @media (prefers-reduced-motion: reduce) {
            .bg-canvas .orb,
            .bg-canvas .grid,
            .login-card::after,
            .login-card:hover,
            .btn,
            .form-group .input-wrap,
            .form-section {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
<style>
@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 100 900;
  font-display: swap;
  src: url('/fonts/Inter-VariableFont_opsz,wght.ttf') format('truetype');
}
@font-face {
  font-family: 'Inter';
  font-style: italic;
  font-weight: 100 900;
  font-display: swap;
  src: url('/fonts/Inter-Italic-VariableFont_opsz,wght.ttf') format('truetype');
}
</style>

<body>

    <!-- ============================================================
    3D ANIMATED BACKGROUND
    ============================================================ -->
    <div class="bg-canvas" aria-hidden="true">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="grid"></div>
    </div>

    <!-- ============================================================
    LOGIN CARD
    ============================================================ -->
    <div class="login-wrapper">
        <div class="login-card">

            <!-- Brand -->
            <div class="login-brand">
                <div class="logo-icon">
                    <i class="fas fa-bolt"></i>
                </div>
                <h1>PrimeShield</h1>
                <div class="tagline">
                    <i class="fas fa-shield-alt"></i> Secure Admin Console
                </div>
            </div>

            <!-- Toggle: Login / Register -->
            <div class="auth-toggle" id="authToggle">
                <div class="slider" id="toggleSlider"></div>
                <button class="active" data-mode="login">Sign In</button>
                <button data-mode="register">Register</button>
            </div>

            <!-- ==========================================================
            MESSAGE CONTAINER
            ========================================================== -->
            <div id="message" class="message"></div>

            <!-- ==========================================================
            LOGIN FORM
            ========================================================== -->
            <div class="form-section active" id="loginForm">
                <h2>Welcome Back</h2>
                <p class="subtitle">Sign in to manage your platform</p>
                <form id="loginFormElement" autocomplete="off" novalidate>
                    <div class="form-group">
                        <label><i class="fas fa-envelope" style="margin-right:6px;"></i> Email Address</label>
                        <div class="input-wrap">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="loginEmail" placeholder="admin@primeshieldhub.com" required autofocus autocomplete="email" />
                        </div>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-lock" style="margin-right:6px;"></i> Password</label>
                        <div class="input-wrap">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="loginPassword" placeholder="Enter your secure password" required autocomplete="current-password" />
                            <button type="button" class="toggle-password" aria-label="Toggle password visibility" tabindex="0">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" id="loginBtn">
                        <i class="fas fa-arrow-right-to-bracket"></i> Sign In
                    </button>
                </form>
            </div>

            <!-- ==========================================================
            REGISTER FORM
            ========================================================== -->
            <div class="form-section" id="registerForm">
                <h2>Create Account</h2>
                <p class="subtitle">Register as an admin</p>
                <form id="registerFormElement" autocomplete="off" novalidate>
                    <div class="form-group">
                        <label><i class="fas fa-user" style="margin-right:6px;"></i> Full Name</label>
                        <div class="input-wrap">
                            <i class="fas fa-user"></i>
                            <input type="text" id="regName" placeholder="John Doe" required autocomplete="name" />
                        </div>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-envelope" style="margin-right:6px;"></i> Email Address</label>
                        <div class="input-wrap">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="regEmail" placeholder="admin@primeshieldhub.com" required autocomplete="email" />
                        </div>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-phone" style="margin-right:6px;"></i> Phone (optional)</label>
                        <div class="input-wrap">
                            <i class="fas fa-phone"></i>
                            <input type="tel" id="regPhone" placeholder="+234 800 000 0000" autocomplete="tel" />
                        </div>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-lock" style="margin-right:6px;"></i> Password</label>
                        <div class="input-wrap">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="regPassword" placeholder="Min 8 characters" required minlength="8" autocomplete="new-password" />
                            <button type="button" class="toggle-password" aria-label="Toggle password visibility" tabindex="0">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="password-strength" id="passwordStrength">
                            <div class="bar" data-index="0"></div>
                            <div class="bar" data-index="1"></div>
                            <div class="bar" data-index="2"></div>
                            <div class="bar" data-index="3"></div>
                            <div class="bar" data-index="4"></div>
                        </div>
                    </div>
                    <div class="form-group reg-code-field show" id="regCodeGroup">
                        <label><i class="fas fa-key" style="margin-right:6px;"></i> Admin Registration Code</label>
                        <div class="input-wrap">
                            <i class="fas fa-key"></i>
                            <input type="text" id="regCode" placeholder="Enter the admin registration code" required autocomplete="off" />
                        </div>
                        <div class="hint">Contact your system administrator to obtain this code.</div>
                    </div>
                    <button type="submit" class="btn btn-gold" id="registerBtn">
                        <i class="fas fa-user-plus"></i> Create Admin Account
                    </button>
                </form>
            </div>

            <!-- Footer Links -->
            <div class="footer-links">
                <a href="#" id="forgotLink"><i class="fas fa-key"></i> Forgot password?</a>
                <span class="divider">·</span>
                <a href="#"><i class="fas fa-headset"></i> Support</a>
                <span class="divider">·</span>
                <a href="#"><i class="fas fa-shield"></i> Security</a>
            </div>

        </div>
    </div>

    <!-- ============================================================
    JAVASCRIPT — FIXED: Uses sessionId, NOT token
    ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ==========================================================
            // CONFIGURATION
            // ==========================================================
            const API_BASE_URL = window.location.hostname === 'localhost'
                ? 'http://localhost:3000'
                : 'https://api.primeshieldhub.com';

            const TOKEN_KEY = 'psh_auth_token';
            const USER_KEY = 'psh_admin_user';

            // ==========================================================
            // UTILITY FUNCTIONS
            // ==========================================================
            function getToken() { return localStorage.getItem(TOKEN_KEY); }
            function setToken(token) { localStorage.setItem(TOKEN_KEY, token); }
            function removeToken() { localStorage.removeItem(TOKEN_KEY); }
            function getUser() {
                try { return JSON.parse(localStorage.getItem(USER_KEY)); } catch { return null; }
            }
            function setUser(user) { localStorage.setItem(USER_KEY, JSON.stringify(user)); }

            // ==========================================================
            // API REQUEST — with retry and timeout
            // ==========================================================
            async function apiRequest(endpoint, options = {}, retries = 2) {
                const url = endpoint.startsWith('http') ? endpoint : `${API_BASE_URL}${endpoint}`;
                const token = getToken();

                for (let attempt = 0; attempt <= retries; attempt++) {
                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 25000);

                        const resp = await fetch(url, {
                            ...options,
                            credentials: 'include',
                            signal: controller.signal,
                            headers: {
                                'Content-Type': 'application/json',
                                'Accept': 'application/json',
                                ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
                                ...(options?.headers || {})
                            }
                        });

                        clearTimeout(timeoutId);

                        if (!resp.ok) {
                            let errorMsg = `HTTP ${resp.status}`;
                            try {
                                const json = await resp.json();
                                errorMsg = json.error || json.message || errorMsg;
                            } catch (e) {}
                            throw new Error(errorMsg);
                        }

                        const json = await resp.json();
                        return json;
                    } catch (err) {
                        if (attempt === retries) throw err;
                        await new Promise(r => setTimeout(r, 500 * (attempt + 1)));
                    }
                }
            }

            // ==========================================================
            // DOM REFS
            // ==========================================================
            const loginForm = document.getElementById('loginFormElement');
            const registerForm = document.getElementById('registerFormElement');
            const loginBtn = document.getElementById('loginBtn');
            const registerBtn = document.getElementById('registerBtn');
            const messageEl = document.getElementById('message');
            const toggleBtns = document.querySelectorAll('#authToggle button');
            const toggleSlider = document.getElementById('toggleSlider');
            const passwordInput = document.getElementById('regPassword');
            const strengthBars = document.querySelectorAll('#passwordStrength .bar');

            // ==========================================================
            // MESSAGE SYSTEM — auto-dismiss
            // ==========================================================
            let messageTimeout = null;

            function showMessage(text, type = 'error', duration = 5000) {
                if (messageTimeout) clearTimeout(messageTimeout);
                const iconMap = {
                    error: 'fa-circle-exclamation',
                    success: 'fa-circle-check',
                    info: 'fa-circle-info'
                };
                messageEl.innerHTML = `<i class="fas ${iconMap[type] || 'fa-circle-info'}"></i> ${text}`;
                messageEl.className = `message ${type}`;
                messageEl.style.display = 'flex';

                if (duration > 0) {
                    messageTimeout = setTimeout(() => hideMessage(), duration);
                }
            }

            function hideMessage() {
                messageEl.className = 'message';
                messageEl.style.display = 'none';
                messageEl.innerHTML = '';
                if (messageTimeout) {
                    clearTimeout(messageTimeout);
                    messageTimeout = null;
                }
            }

            // ==========================================================
            // PASSWORD TOGGLE — FULLY CLICKABLE
            // ==========================================================
            document.querySelectorAll('.toggle-password').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const input = this.closest('.input-wrap').querySelector('input');
                    if (!input) return;
                    const icon = this.querySelector('i');
                    if (input.type === 'password') {
                        input.type = 'text';
                        icon.className = 'fas fa-eye-slash';
                        this.setAttribute('aria-label', 'Hide password');
                    } else {
                        input.type = 'password';
                        icon.className = 'fas fa-eye';
                        this.setAttribute('aria-label', 'Show password');
                    }
                    input.focus();
                });

                btn.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        this.click();
                    }
                });
            });

            // ==========================================================
            // PASSWORD STRENGTH INDICATOR
            // ==========================================================
            function checkPasswordStrength(password) {
                let score = 0;
                if (password.length >= 8) score++;
                if (password.length >= 12) score++;
                if (/[a-z]/.test(password) && /[A-Z]/.test(password)) score++;
                if (/\d/.test(password)) score++;
                if (/[^a-zA-Z0-9]/.test(password)) score++;
                return Math.min(score, 5);
            }

            passwordInput.addEventListener('input', function() {
                const strength = checkPasswordStrength(this.value);
                const labels = ['weak', 'weak', 'medium', 'medium', 'strong', 'strong'];

                strengthBars.forEach((bar, index) => {
                    bar.className = 'bar';
                    if (index < strength) {
                        bar.classList.add('active', labels[strength]);
                    }
                });
            });

            // ==========================================================
            // AUTH TOGGLE — with 3D slider animation
            // ==========================================================
            toggleBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const mode = this.dataset.mode;

                    toggleBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');

                    if (mode === 'register') {
                        toggleSlider.classList.add('right');
                    } else {
                        toggleSlider.classList.remove('right');
                    }

                    document.getElementById('loginForm').classList.toggle('active', mode === 'login');
                    document.getElementById('registerForm').classList.toggle('active', mode === 'register');

                    const subtitle = document.querySelector('.form-section.active .subtitle');
                    if (subtitle) {
                        subtitle.textContent = mode === 'login' ?
                            'Sign in to manage your platform' :
                            'Register as an admin';
                    }

                    hideMessage();

                    const firstInput = document.querySelector('.form-section.active input');
                    if (firstInput) setTimeout(() => firstInput.focus(), 100);
                });
            });

            // ==========================================================
            // BUTTON LOADING STATE — with ripple
            // ==========================================================
            function setButtonLoading(btn, loading) {
                if (!btn) return;
                if (loading) {
                    btn._originalText = btn.innerHTML;
                    btn.disabled = true;
                    btn.innerHTML = '<span class="spinner"></span> Processing...';
                } else {
                    btn.disabled = false;
                    btn.innerHTML = btn._originalText || btn.textContent;
                }
            }

            document.querySelectorAll('.btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const rect = this.getBoundingClientRect();
                    const ripple = document.createElement('span');
                    ripple.className = 'ripple';
                    const size = Math.max(rect.width, rect.height);
                    ripple.style.width = ripple.style.height = size + 'px';
                    ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
                    ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
                    this.appendChild(ripple);
                    setTimeout(() => ripple.remove(), 600);
                });
            });

            // ==========================================================
            // LOGIN HANDLER — FIXED: Uses sessionId, NOT token
            // ==========================================================
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideMessage();

                const email = document.getElementById('loginEmail').value.trim();
                const password = document.getElementById('loginPassword').value;

                if (!email || !password) {
                    showMessage('Please fill in all fields', 'error');
                    return;
                }

                if (!email.includes('@')) {
                    showMessage('Please enter a valid email address', 'error');
                    return;
                }

                setButtonLoading(loginBtn, true);

                try {
                    const result = await apiRequest('/api/auth/admin-login', {
                        method: 'POST',
                        body: JSON.stringify({ email, password })
                    });

                    console.log('🔍 Login response:', result);

                    // ✅ FIX: The backend returns sessionId, NOT token!
                    // sessionId example: "lNh8CMTjZD19NAElBXWc9" (short, no dots)
                    // token example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." (JWT, long, with dots)
                    const sessionId = result.sessionId || result.session || result.token;

                    if (result.success && sessionId) {
                        console.log('🔑 Storing session ID:', sessionId);
                        console.log('📝 Is JWT?', sessionId.includes('.') ? '⚠️ YES (JWT)' : '✅ NO (Session ID)');
                        setToken(sessionId);  // ← Stores session ID, NOT JWT!
                        if (result.user) setUser(result.user);

                        showMessage('✅ Login successful! Redirecting...', 'success', 2000);

                        setTimeout(() => {
                            window.location.href = result.redirect || '/admin/';
                        }, 800);
                    } else {
                        showMessage(result.error || 'Invalid credentials. Please try again.', 'error');
                    }
                } catch (err) {
                    console.error('Login error:', err);
                    showMessage(err.message || 'Connection error. Please check your network.', 'error');
                } finally {
                    setButtonLoading(loginBtn, false);
                }
            });

            // ==========================================================
            // REGISTER HANDLER — FIXED: Uses sessionId, NOT token
            // ==========================================================
            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideMessage();

                const name = document.getElementById('regName').value.trim();
                const email = document.getElementById('regEmail').value.trim();
                const phone = document.getElementById('regPhone').value.trim();
                const password = document.getElementById('regPassword').value;
                const adminCode = document.getElementById('regCode').value.trim();

                if (!name || !email || !password || !adminCode) {
                    showMessage('Please fill in all required fields', 'error');
                    return;
                }

                if (password.length < 8) {
                    showMessage('Password must be at least 8 characters', 'error');
                    return;
                }

                if (!email.includes('@')) {
                    showMessage('Please enter a valid email address', 'error');
                    return;
                }

                setButtonLoading(registerBtn, true);

                try {
                    const result = await apiRequest('/api/auth/admin-register', {
                        method: 'POST',
                        body: JSON.stringify({ name, email, phone, password, adminCode })
                    });

                    console.log('🔍 Register response:', result);

                    if (result.success) {
                        // ✅ FIX: Get session ID from the response
                        const sessionId = result.sessionId || result.session || result.token;

                        showMessage('✅ Admin account created! Redirecting...', 'success', 2000);

                        if (sessionId) {
                            console.log('🔑 Storing session ID from registration:', sessionId);
                            console.log('📝 Is JWT?', sessionId.includes('.') ? '⚠️ YES (JWT)' : '✅ NO (Session ID)');
                            setToken(sessionId);
                        }
                        if (result.user) setUser(result.user);

                        setTimeout(() => {
                            window.location.href = result.redirect || '/admin/';
                        }, 1000);
                    } else {
                        showMessage(result.error || 'Registration failed. Please try again.', 'error');
                    }
                } catch (err) {
                    console.error('Registration error:', err);
                    showMessage(err.message || 'Connection error. Please check your network.', 'error');
                } finally {
                    setButtonLoading(registerBtn, false);
                }
            });

            // ==========================================================
            // FORGOT PASSWORD
            // ==========================================================
            document.getElementById('forgotLink').addEventListener('click', (e) => {
                e.preventDefault();
                showMessage('🔄 Please contact support to reset your password.', 'info', 6000);
            });

            // ==========================================================
            // KEYBOARD SHORTCUTS
            // ==========================================================
            document.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.shiftKey && e.key === 'L') {
                    e.preventDefault();
                    document.getElementById('loginEmail').focus();
                }
                if (e.ctrlKey && e.shiftKey && e.key === 'R') {
                    e.preventDefault();
                    document.querySelector('#authToggle button[data-mode="register"]').click();
                    setTimeout(() => document.getElementById('regName').focus(), 150);
                }
                if (e.key === 'Escape') {
                    hideMessage();
                }
            });

            // ==========================================================
            // SESSION CHECK — auto-redirect if already logged in
            // ==========================================================
            (async function checkAuth() {
                const token = getToken();
                if (!token) return;

                try {
                    const result = await apiRequest('/api/auth/admin-check');
                    if (result.authenticated) {
                        window.location.href = '/admin/';
                    }
                } catch (e) {
                    removeToken();
                }
            })();

            // ==========================================================
            // CONSOLE BRANDING
            // ==========================================================
            console.log('%c⚡ PrimeShieldHub', 'font-size:24px; font-weight:700; color:#00f0ff;');
            console.log('%c🔐 Admin Login Portal v3.0 (Session Auth FIXED)', 'font-size:14px; color:#a8b5e0;');
            console.log('%c📡 API: ' + API_BASE_URL, 'font-size:12px; color:#6a7aaa;');
            console.log('%c💡 Shortcuts: Ctrl+Shift+L (login) · Ctrl+Shift+R (register)', 'font-size:12px; color:#6a7aaa;');
            console.log('%c🔑 Uses sessionId from backend (NOT JWT token)', 'font-size:12px; color:#ffd866;');

            // ==========================================================
            // AUTO-FOCUS — after page load
            // ==========================================================
            window.addEventListener('load', () => {
                setTimeout(() => document.getElementById('loginEmail').focus(), 300);
            });

        })();
    </script>

</body>
</html>
