<!DOCTYPE html>
<html lang="en-NG" data-theme="buildmart-gold">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="description" content="BuildMart AI Assistant - Construction materials, pricing, stock availability.">
    <meta name="theme-color" content="#0a1628">
    <meta name="api-base-url" content="https://api.primeshieldhub.com/api">
    
    <title>BuildMart · AI Assistant</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        /* ============================================================
           ROOT VARIABLES - BUILDMART THEME
           ============================================================ */
        :root {
            --gold: #F59E0B;
            --gold-light: #FBBF24;
            --gold-dark: #D97706;
            --gold-glow: rgba(245, 158, 11, 0.12);
            
            --cyan: #00D4FF;
            --cyan-glow: rgba(0, 212, 255, 0.08);
            
            --bg-deep: #02080E;
            --bg-primary: #0A1628;
            --bg-card: rgba(8, 20, 34, 0.45);
            --bg-input: rgba(0, 0, 0, 0.4);
            
            --text-primary: #E3F0FF;
            --text-secondary: #8EB6D9;
            --text-muted: #4A6A8A;
            --text-inverse: #02080E;
            
            --accent-success: #10B981;
            --accent-warning: #F59E0B;
            --accent-danger: #EF4444;
            
            --font-sans: 'Inter', -apple-system, system-ui, sans-serif;
            --font-display: 'Space Grotesk', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            
            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --radius-2xl: 48px;
            --radius-3xl: 64px;
            
            --shadow-card: 0 40px 70px -30px rgba(0,0,0,0.9);
            --shadow-glow: 0 0 40px rgba(0, 120, 255, 0.05);
            
            --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            --transition-bounce: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font-sans);
            background: var(--bg-deep);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 0% 30%, rgba(0, 140, 255, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 100% 70%, rgba(100, 0, 255, 0.06) 0%, transparent 45%),
                radial-gradient(circle at 50% 100%, rgba(0, 200, 255, 0.04) 0%, transparent 70%),
                linear-gradient(160deg, #020a12 0%, #0a1628 100%);
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }
        ::selection { background: rgba(245, 158, 11, 0.25); }

        /* ============================================================
           HEADER
           ============================================================ */
        .app-header {
            background: rgba(10, 22, 42, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 200, 255, 0.08);
            padding: 0.8rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 10;
        }
        .app-header .logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
        }
        .app-header .logo img {
            height: 32px;
            border-radius: 6px;
        }
        .app-header .logo .logo-text {
            font-weight: 800;
            font-size: 1rem;
            font-family: var(--font-display);
            color: var(--text-primary);
        }
        .app-header .logo .logo-text em {
            font-style: normal;
            color: var(--gold);
        }
        .app-header .logo .badge {
            background: var(--gold);
            color: var(--text-inverse);
            font-size: 0.5rem;
            font-weight: 700;
            padding: 0.1rem 0.6rem;
            border-radius: 50px;
            text-transform: uppercase;
        }
        .header-status {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 0.7rem;
            color: var(--text-muted);
        }
        .header-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-success);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .header-status .model-badge {
            background: rgba(0, 180, 255, 0.1);
            border: 1px solid rgba(0, 180, 255, 0.2);
            border-radius: 50px;
            padding: 0.2rem 0.8rem;
            font-size: 0.6rem;
            color: var(--cyan);
            font-weight: 600;
        }
        .header-actions {
            display: flex;
            gap: 0.5rem;
        }
        .header-actions a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.7rem;
            padding: 0.3rem 0.8rem;
            border-radius: 50px;
            transition: var(--transition-smooth);
            border: 1px solid rgba(255,255,255,0.04);
        }
        .header-actions a:hover {
            color: var(--text-primary);
            border-color: rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.03);
        }

        /* ============================================================
           CHAT AREA
           ============================================================ */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 0 1.5rem;
            overflow: hidden;
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            scroll-behavior: smooth;
        }

        /* ============================================================
           WELCOME SCREEN
           ============================================================ */
        .welcome-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            animation: fadeIn 0.6s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .welcome-screen .icon {
            font-size: 4rem;
            margin-bottom: 1.2rem;
            filter: drop-shadow(0 10px 30px rgba(245, 158, 11, 0.2));
        }
        .welcome-screen h1 {
            font-size: 1.8rem;
            font-weight: 800;
            font-family: var(--font-display);
            background: linear-gradient(135deg, #f0fcff, #6ac8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .welcome-screen p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            max-width: 500px;
            margin: 0.5rem 0 1.5rem;
            line-height: 1.7;
        }
        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
        }
        .quick-action-btn {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 50px;
            padding: 0.4rem 1rem;
            color: var(--text-secondary);
            font-size: 0.7rem;
            cursor: pointer;
            transition: var(--transition-smooth);
            font-family: var(--font-sans);
        }
        .quick-action-btn:hover {
            background: rgba(245, 158, 11, 0.08);
            border-color: var(--gold);
            color: var(--text-primary);
            transform: translateY(-2px);
        }
        .quick-action-btn i { margin-right: 4px; }

        /* ============================================================
           MESSAGES
           ============================================================ */
        .message {
            display: flex;
            gap: 0.8rem;
            animation: slideIn 0.35s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user { justify-content: flex-end; }
        .message.assistant { justify-content: flex-start; }
        .message.system { justify-content: center; }

        .message .avatar {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            font-size: 0.8rem;
            font-weight: 700;
        }
        .message.assistant .avatar {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(245, 158, 11, 0.05));
            color: var(--gold);
            border: 1px solid rgba(245, 158, 11, 0.15);
        }
        .message.user .avatar {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.15), rgba(0, 212, 255, 0.05));
            color: var(--cyan);
            border: 1px solid rgba(0, 212, 255, 0.15);
        }

        .message .bubble {
            max-width: 78%;
            padding: 0.8rem 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.7;
            word-break: break-word;
        }
        .message.assistant .bubble {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.05);
            border-top-left-radius: 4px;
            color: #e0dde5;
        }
        .message.user .bubble {
            background: rgba(245, 158, 11, 0.08);
            border: 1px solid rgba(245, 158, 11, 0.12);
            border-top-right-radius: 4px;
            color: #f0efe8;
        }
        .message.system .bubble {
            background: rgba(245, 158, 11, 0.06);
            border: 1px solid rgba(245, 158, 11, 0.12);
            border-radius: 14px;
            font-size: 0.78rem;
            color: var(--gold);
            text-align: center;
            max-width: 90%;
        }

        .message .bubble p { margin-bottom: 0.5rem; }
        .message .bubble p:last-child { margin-bottom: 0; }
        .message .bubble strong { color: var(--gold); font-weight: 600; }
        .message .bubble ul, .message .bubble ol { margin: 0.5rem 0; padding-left: 1.2rem; }
        .message .bubble li { margin-bottom: 0.2rem; }
        .message .bubble code {
            background: rgba(0,0,0,0.3);
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 0.8rem;
        }

        .message-time {
            font-size: 0.6rem;
            color: var(--text-muted);
            margin-top: 0.2rem;
            font-family: var(--font-mono);
        }
        .message.user .message-time { text-align: right; }

        /* Product Card */
        .product-card {
            display: flex;
            gap: 0.8rem;
            background: rgba(245, 158, 11, 0.05);
            border: 1px solid rgba(245, 158, 11, 0.12);
            border-radius: 12px;
            padding: 0.6rem 1rem;
            margin: 0.4rem 0;
            align-items: center;
            cursor: pointer;
            transition: var(--transition-smooth);
        }
        .product-card:hover {
            background: rgba(245, 158, 11, 0.1);
            border-color: var(--gold);
            transform: translateX(4px);
        }
        .product-card .p-icon {
            width: 40px;
            height: 40px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            display: grid;
            place-items: center;
            font-size: 1.1rem;
            color: var(--gold);
            flex-shrink: 0;
        }
        .product-card .p-info { flex: 1; min-width: 0; }
        .product-card .p-name { font-weight: 600; font-size: 0.8rem; }
        .product-card .p-detail { font-size: 0.65rem; color: var(--text-muted); }
        .product-card .p-price { color: var(--gold); font-weight: 700; font-size: 0.85rem; }
        .product-card .p-stock {
            font-size: 0.6rem;
            padding: 0.1rem 0.5rem;
            border-radius: 50px;
            white-space: nowrap;
        }
        .product-card .p-stock.in-stock { background: rgba(16, 185, 129, 0.15); color: var(--accent-success); }
        .product-card .p-stock.low-stock { background: rgba(245, 158, 11, 0.15); color: var(--accent-warning); }
        .product-card .p-stock.out-of-stock { background: rgba(239, 68, 68, 0.15); color: var(--accent-danger); }

        /* ============================================================
           TYPING INDICATOR
           ============================================================ */
        .typing-indicator {
            display: flex;
            gap: 0.6rem;
            align-items: center;
            padding: 0.3rem 0;
        }
        .typing-dots { display: flex; gap: 4px; }
        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--gold);
            animation: typingBounce 1.4s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce {
            0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
            30% { opacity: 1; transform: translateY(-6px); }
        }

        /* ============================================================
           INPUT AREA
           ============================================================ */
        .input-area {
            padding: 0.8rem 0 1.2rem;
            flex-shrink: 0;
            background: rgba(10, 22, 42, 0.85);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0, 200, 255, 0.05);
        }
        .input-wrapper {
            display: flex;
            gap: 0.6rem;
            align-items: flex-end;
            background: var(--bg-input);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            padding: 0.2rem 0.2rem 0.2rem 1rem;
            transition: var(--transition-smooth);
        }
        .input-wrapper:focus-within {
            border-color: rgba(245, 158, 11, 0.3);
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.06);
        }
        .input-wrapper textarea {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 0.9rem;
            resize: none;
            outline: none;
            padding: 0.5rem 0;
            max-height: 100px;
            line-height: 1.5;
            overflow-y: auto;
        }
        .input-wrapper textarea::placeholder { color: var(--text-muted); }
        .input-wrapper .tools {
            display: flex;
            gap: 0.2rem;
            align-items: center;
            flex-shrink: 0;
        }
        .input-wrapper .tools button {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition-smooth);
            display: grid;
            place-items: center;
            font-size: 0.85rem;
        }
        .input-wrapper .tools button:hover {
            color: var(--gold);
            background: rgba(245, 158, 11, 0.08);
        }
        .send-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            border: none;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: var(--transition-bounce);
            flex-shrink: 0;
        }
        .send-btn:hover:not(:disabled) {
            transform: scale(1.08);
            box-shadow: 0 8px 28px rgba(245, 158, 11, 0.3);
        }
        .send-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }
        .send-btn i { color: var(--text-inverse); font-size: 0.95rem; }
        .input-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 0.4rem;
            font-size: 0.55rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
            flex-wrap: wrap;
            gap: 0.3rem;
        }

        /* ============================================================
           TOAST
           ============================================================ */
        #toast {
            position: fixed;
            bottom: 90px;
            right: 30px;
            background: rgba(10, 22, 42, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(245, 158, 11, 0.12);
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius-sm);
            z-index: 9999;
            transform: translateY(80px);
            opacity: 0;
            transition: all 0.4s ease;
            max-width: 360px;
        }
        #toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        #toast .toast-content { display: flex; align-items: center; gap: 0.6rem; }
        #toast .toast-icon { color: var(--gold); font-size: 1rem; }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 768px) {
            .app-header { padding: 0.5rem 1rem; }
            .app-header .logo .badge { display: none; }
            .chat-container { padding: 0 0.8rem; }
            .message .bubble { max-width: 88%; font-size: 0.82rem; padding: 0.6rem 0.9rem; }
            .welcome-screen h1 { font-size: 1.3rem; }
            .welcome-screen .icon { font-size: 3rem; }
            .quick-action-btn { font-size: 0.6rem; padding: 0.2rem 0.7rem; }
            .header-status .model-badge { display: none; }
            .product-card { flex-wrap: wrap; }
            .header-actions a { font-size: 0.6rem; padding: 0.2rem 0.5rem; }
        }
        @media (max-width: 480px) {
            .input-wrapper { padding: 0.2rem 0.2rem 0.2rem 0.6rem; border-radius: 20px; }
            .input-wrapper textarea { font-size: 0.8rem; }
            .send-btn { width: 34px; height: 34px; }
            .input-wrapper .tools button { width: 28px; height: 28px; font-size: 0.7rem; }
        }
    </style>
<style>
@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 100 900;
  font-display: swap;
  src: url('/fonts/Inter-VariableFont_opsz,wght.ttf') format('truetype');
}
@font-face {
  font-family: 'Inter';
  font-style: italic;
  font-weight: 100 900;
  font-display: swap;
  src: url('/fonts/Inter-Italic-VariableFont_opsz,wght.ttf') format('truetype');
}
</style>
</head>
<body>

<!-- ============================================================
     HEADER
     ============================================================ -->
<header class="app-header">
    <a href="/buildmart/" class="logo">
        <img src="/buildmart/company_logo.png" alt="BuildMart" onerror="this.style.display='none'">
        <span class="logo-text"><em>Build</em>Mart</span>
        <span class="badge">AI</span>
    </a>
    <div class="header-status">
        <span class="dot"></span>
        <span>Gemini 2.5 Flash</span>
        <span class="model-badge"><i class="fas fa-brain"></i> Construction</span>
    </div>
    <div class="header-actions">
        <a href="/buildmart/"><i class="fas fa-home"></i></a>
        <a href="/buildmart/products.html"><i class="fas fa-box"></i></a>
        <a href="/buildmart/cart.html"><i class="fas fa-shopping-cart"></i></a>
    </div>
</header>

<!-- ============================================================
     CHAT CONTAINER
     ============================================================ -->
<div class="chat-container">
    <div class="messages-area" id="messagesArea">
        <!-- Welcome Screen -->
        <div class="welcome-screen" id="welcomeScreen">
            <div class="icon">🏗️</div>
            <h1>BuildMart Assistant</h1>
            <p>
                Your AI procurement assistant for construction materials.<br>
                Ask about products, prices, availability, or get recommendations.
            </p>
            <div class="quick-actions">
                <button class="quick-action-btn" data-prompt="What cement brands do you have?"><i class="fas fa-cube"></i> Cement</button>
                <button class="quick-action-btn" data-prompt="Show me roofing materials"><i class="fas fa-home"></i> Roofing</button>
                <button class="quick-action-btn" data-prompt="What paints are in stock?"><i class="fas fa-paint-roller"></i> Paints</button>
                <button class="quick-action-btn" data-prompt="Show me plumbing pipes"><i class="fas fa-wrench"></i> Plumbing</button>
                <button class="quick-action-btn" data-prompt="What tools do you have?"><i class="fas fa-tools"></i> Tools</button>
                <button class="quick-action-btn" data-prompt="Tell me about BuildMart wholesale pricing"><i class="fas fa-tags"></i> Wholesale</button>
                <button class="quick-action-btn" data-prompt="What hardware items do you sell?"><i class="fas fa-door-open"></i> Hardware</button>
                <button class="quick-action-btn" data-prompt="Show me timber and plywood"><i class="fas fa-tree"></i> Timber</button>
            </div>
        </div>
    </div>

    <!-- ============================================================
         INPUT AREA
         ============================================================ -->
    <div class="input-area">
        <div class="input-wrapper">
            <textarea id="chatInput" placeholder="Ask about construction materials..." rows="1"></textarea>
            <div class="tools">
                <button id="voiceBtn" title="Voice input"><i class="fas fa-microphone"></i></button>
                <button id="clearBtn" title="Clear chat"><i class="fas fa-eraser"></i></button>
            </div>
            <button class="send-btn" id="sendBtn" disabled><i class="fas fa-arrow-up"></i></button>
        </div>
        <div class="input-footer">
            <span><i class="fas fa-shield-alt"></i> Powered by Gemini AI</span>
            <span id="charCount">0 / 2000</span>
        </div>
    </div>
</div>

<!-- ============================================================
     TOAST
     ============================================================ -->
<div id="toast">
    <div class="toast-content">
        <span class="toast-icon">✓</span>
        <div>
            <div style="font-weight:600; font-size:0.85rem;" id="toastTitle">Success</div>
            <div style="color:var(--text-muted); font-size:0.75rem;" id="toastMessage">Action completed</div>
        </div>
    </div>
</div>

<!-- ============================================================
     SCRIPTS
     ============================================================ -->
<script>
    // =========================================================================
    // CONFIGURATION
    // =========================================================================
    const API_BASE = document.querySelector('meta[name="api-base-url"]')?.content || 'https://api.primeshieldhub.com/api';
    const MAX_CHARS = 2000;
    let isProcessing = false;
    let conversationHistory = [];
    let sessionId = localStorage.getItem('buildmart_ai_session') || 'bm_' + Date.now() + '_' + crypto.randomUUID().slice(0, 6);
    localStorage.setItem('buildmart_ai_session', sessionId);

    // =========================================================================
    // DOM REFS
    // =========================================================================
    const DOM = {
        messages: document.getElementById('messagesArea'),
        welcome: document.getElementById('welcomeScreen'),
        input: document.getElementById('chatInput'),
        sendBtn: document.getElementById('sendBtn'),
        charCount: document.getElementById('charCount'),
        toast: document.getElementById('toast'),
        toastTitle: document.getElementById('toastTitle'),
        toastMessage: document.getElementById('toastMessage'),
        voiceBtn: document.getElementById('voiceBtn'),
        clearBtn: document.getElementById('clearBtn'),
    };

    // =========================================================================
    // UTILITY FUNCTIONS
    // =========================================================================
    function formatTime() {
        return new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function showToast(title, message, icon = '✓') {
        DOM.toast.querySelector('.toast-icon').textContent = icon;
        DOM.toastTitle.textContent = title;
        DOM.toastMessage.textContent = message;
        DOM.toast.classList.add('show');
        clearTimeout(window.toastTimeout);
        window.toastTimeout = setTimeout(() => DOM.toast.classList.remove('show'), 4000);
    }

    function scrollToBottom() {
        requestAnimationFrame(() => {
            DOM.messages.scrollTop = DOM.messages.scrollHeight;
        });
    }

    // =========================================================================
    // PRODUCT CARD
    // =========================================================================
    function createProductCard(product) {
        const stockStatus = product.stock > 20 ? 'in-stock' : product.stock > 0 ? 'low-stock' : 'out-of-stock';
        const stockLabel = product.stock > 20 ? 'In Stock' : product.stock > 0 ? 'Low Stock' : 'Out of Stock';
        
        return `
            <div class="product-card" data-id="${product.id}">
                <div class="p-icon"><i class="fas fa-box"></i></div>
                <div class="p-info">
                    <div class="p-name">${escapeHtml(product.name)}</div>
                    <div class="p-detail">${escapeHtml(product.category || '')}</div>
                </div>
                <div class="p-price">₦${Number(product.price).toLocaleString()}</div>
                <span class="p-stock ${stockStatus}">${stockLabel}</span>
            </div>
        `;
    }

    // =========================================================================
    // MESSAGE RENDER
    // =========================================================================
    function appendMessage(role, content, timestamp, products = null) {
        DOM.welcome.style.display = 'none';
        
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${role}`;
        
        const avatar = role === 'assistant' ? '<i class="fas fa-robot"></i>' : 
                       role === 'user' ? '<i class="fas fa-user"></i>' : '<i class="fas fa-info"></i>';
        
        let bubbleContent = content;
        
        if (products && products.length > 0) {
            bubbleContent += '<div style="margin-top:0.6rem;">';
            products.forEach(p => {
                bubbleContent += createProductCard(p);
            });
            bubbleContent += '</div>';
        }
        
        messageDiv.innerHTML = `
            <div class="avatar">${avatar}</div>
            <div class="bubble">${bubbleContent}</div>
        `;
        
        DOM.messages.appendChild(messageDiv);
        
        const timeDiv = document.createElement('div');
        timeDiv.className = 'message-time';
        timeDiv.textContent = timestamp || formatTime();
        messageDiv.appendChild(timeDiv);
        
        scrollToBottom();
    }

    function appendSystemMessage(content) {
        DOM.welcome.style.display = 'none';
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message system';
        messageDiv.innerHTML = `<div class="bubble">${content}</div>`;
        DOM.messages.appendChild(messageDiv);
        scrollToBottom();
    }

    // =========================================================================
    // TYPING INDICATOR
    // =========================================================================
    function showTyping() {
        const existing = document.getElementById('typingIndicator');
        if (existing) existing.remove();
        
        const div = document.createElement('div');
        div.id = 'typingIndicator';
        div.className = 'typing-indicator';
        div.innerHTML = `
            <div class="avatar" style="width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(245,158,11,0.2),rgba(245,158,11,0.05));color:var(--gold);border:1px solid rgba(245,158,11,0.15);"><i class="fas fa-robot"></i></div>
            <div class="typing-dots">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        `;
        DOM.messages.appendChild(div);
        scrollToBottom();
    }

    function hideTyping() {
        document.getElementById('typingIndicator')?.remove();
    }

    // =========================================================================
    // SEND MESSAGE
    // =========================================================================
    async function sendMessage(text) {
        const message = text || DOM.input.value.trim();
        if (!message || isProcessing) return;
        if (message.length > MAX_CHARS) {
            showToast('Error', 'Message too long. Limit: ' + MAX_CHARS + ' characters', '⚠️');
            return;
        }

        DOM.input.value = '';
        DOM.input.style.height = 'auto';
        updateSendButton();
        updateCharCount();

        appendMessage('user', escapeHtml(message));
        conversationHistory.push({ role: 'user', content: message });

        isProcessing = true;
        DOM.sendBtn.disabled = true;
        showTyping();

        try {
            const response = await fetch(`${API_BASE}/ai/chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    messages: conversationHistory.slice(-10),
                    message: message,
                    sessionId: sessionId,
                    context: {
                        page: 'buildmart_ai',
                        categories: ['cement', 'roofing', 'paints', 'plumbing', 'electrical', 'timber', 'tools', 'hardware', 'tiles', 'gas-cylinders']
                    }
                })
            });

            hideTyping();

            if (response.ok) {
                const data = await response.json();
                const reply = data.reply || 'I understand. Let me help you with that.';
                const products = data.products || null;
                
                appendMessage('assistant', reply, null, products);
                conversationHistory.push({ role: 'assistant', content: reply });
            } else {
                throw new Error('API returned ' + response.status);
            }

        } catch (error) {
            hideTyping();
            console.error('AI Error:', error);
            appendSystemMessage('⚠️ Sorry, I\'m having trouble connecting. Please try again or contact support on WhatsApp.');
            showToast('Error', 'Connection failed. Please try again.', '⚠️');
        }

        isProcessing = false;
        updateSendButton();
        DOM.input.focus();
    }

    // =========================================================================
    // UI UPDATES
    // =========================================================================
    function updateSendButton() {
        const text = DOM.input.value.trim();
        DOM.sendBtn.disabled = !text || isProcessing || text.length > MAX_CHARS;
    }

    function updateCharCount() {
        const length = DOM.input.value.length;
        DOM.charCount.textContent = `${length} / ${MAX_CHARS}`;
        DOM.charCount.style.color = length > MAX_CHARS * 0.9 ? 'var(--accent-warning)' : 'var(--text-muted)';
    }

    function clearChat() {
        if (confirm('Clear all messages?')) {
            DOM.messages.querySelectorAll('.message').forEach(el => el.remove());
            DOM.welcome.style.display = 'flex';
            conversationHistory = [];
            sessionId = 'bm_' + Date.now() + '_' + crypto.randomUUID().slice(0, 6);
            localStorage.setItem('buildmart_ai_session', sessionId);
            showToast('Cleared', 'Chat history cleared');
        }
    }

    // =========================================================================
    // VOICE INPUT
    // =========================================================================
    function setupVoice() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            DOM.voiceBtn.style.display = 'none';
            return;
        }
        
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = true;
        recognition.lang = 'en-NG';
        
        let isRecording = false;
        
        recognition.onresult = (event) => {
            let transcript = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
                transcript += event.results[i][0].transcript;
            }
            DOM.input.value = transcript;
            updateSendButton();
            updateCharCount();
        };
        
        recognition.onend = () => {
            isRecording = false;
            DOM.voiceBtn.querySelector('i').className = 'fas fa-microphone';
            DOM.voiceBtn.style.color = '';
        };
        
        recognition.onerror = (event) => {
            isRecording = false;
            DOM.voiceBtn.querySelector('i').className = 'fas fa-microphone';
            DOM.voiceBtn.style.color = '';
            if (event.error !== 'aborted') {
                showToast('Voice', 'Please allow microphone access', '⚠️');
            }
        };
        
        DOM.voiceBtn.addEventListener('click', () => {
            if (isRecording) {
                recognition.stop();
                return;
            }
            try {
                recognition.start();
                isRecording = true;
                DOM.voiceBtn.querySelector('i').className = 'fas fa-stop';
                DOM.voiceBtn.style.color = 'var(--accent-danger)';
                showToast('Voice', 'Listening... speak now', '🎤');
            } catch (e) {
                showToast('Voice', 'Could not start voice recognition', '⚠️');
            }
        });
    }

    // =========================================================================
    // EVENT LISTENERS
    // =========================================================================
    function initEvents() {
        DOM.sendBtn.addEventListener('click', () => sendMessage());
        
        DOM.input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        DOM.input.addEventListener('input', () => {
            DOM.input.style.height = 'auto';
            DOM.input.style.height = Math.min(DOM.input.scrollHeight, 100) + 'px';
            updateSendButton();
            updateCharCount();
        });
        
        document.querySelectorAll('.quick-action-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const prompt = btn.dataset.prompt;
                if (prompt) sendMessage(prompt);
            });
        });
        
        DOM.clearBtn.addEventListener('click', clearChat);
        
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });
    }

    // =========================================================================
    // INITIALIZATION
    // =========================================================================
    function init() {
        console.log('🏗️ BuildMart AI Assistant');
        console.log('📡 API:', API_BASE);
        console.log('🆔 Session:', sessionId);
        
        setupVoice();
        initEvents();
        updateSendButton();
        updateCharCount();
        DOM.input.focus();
        
        setTimeout(() => {
            showToast('🏗️ BuildMart AI', 'Ask me about construction materials!');
        }, 1000);
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
