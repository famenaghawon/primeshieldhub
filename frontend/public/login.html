<!DOCTYPE html>
<html lang="en" data-quantum-version="9.0.0">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="PrimeShieldHub Quantum Access Portal">
  <meta name="theme-color" content="#000000">
  <title>PrimeShieldHub | Quantum Access Portal</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Cloudflare Turnstile (loaded dynamically after config fetch) -->
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js" } }

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-deep: #010105; --surface-dark: rgba(8, 12, 25, 0.75);
      --glass-edge: rgba(0, 247, 255, 0.25); --neon-cyan: #00f7ff;
      --neon-purple: #b200ff; --neon-gold: #ffd966;
      --accent-success: #33ffaa; --accent-danger: #ff3366;
      --text-primary: #f0f3ff; --text-secondary: #9ca3cf;
      --gradient-primary: linear-gradient(135deg, #00f7ff, #b200ff);
      --gradient-gold: linear-gradient(135deg, #ffd966, #ffaa33);
      --shadow-glow: 0 0 20px rgba(0, 247, 255, 0.3);
      --radius-card: 2rem; --transition-smooth: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    body {
      font-family: 'Inter', 'Space Grotesk', sans-serif;
      background: var(--bg-deep); color: var(--text-primary);
      min-height: 100vh; overflow-x: hidden; position: relative;
    }
    #quantum-bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; opacity: 0.7; pointer-events: none; }
    .quantum-grid-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-image: linear-gradient(rgba(0,247,255,0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(0,247,255,0.08) 1px, transparent 1px);
      background-size: 50px 50px; z-index: -1; animation: gridShift 20s linear infinite;
    }
    @keyframes gridShift { 0% { transform: translate(0, 0); } 100% { transform: translate(50px, 50px); } }
    .quantum-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .quantum-card {
      background: var(--surface-dark); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius-card); border: 1px solid var(--glass-edge);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
      width: 100%; max-width: 500px; padding: 2.5rem;
      transition: var(--transition-smooth); animation: floatIn 0.8s ease-out;
    }
    @keyframes floatIn { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    .quantum-header { text-align: center; margin-bottom: 2rem; }
    .quantum-logo {
      width: 80px; height: 80px; margin: 0 auto 1rem;
      background: var(--gradient-primary); border-radius: 1.5rem;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem; font-weight: 900; font-family: 'Orbitron', monospace;
      color: white; box-shadow: 0 0 30px rgba(0,247,255,0.4);
    }
    .quantum-header h1 { font-size: 2rem; font-weight: 800; background: var(--gradient-gold); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: -0.5px; }
    .quantum-header p { color: var(--text-secondary); margin-top: 0.5rem; font-size: 0.9rem; }
    .form-group { margin-bottom: 1.5rem; position: relative; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-secondary); }
    .form-group label i { margin-right: 0.5rem; color: var(--neon-cyan); }
    .form-group input {
      width: 100%; background: rgba(0,0,0,0.5); border: 1px solid var(--glass-edge);
      border-radius: 2rem; padding: 1rem 1.2rem; color: white; font-size: 1rem;
      transition: var(--transition-smooth);
    }
    .form-group input:focus { outline: none; border-color: var(--neon-cyan); box-shadow: 0 0 12px rgba(0,247,255,0.3); }
    
    /* PASSWORD TOGGLE - Enhanced */
    .password-wrapper { position: relative; }
    .password-wrapper input { padding-right: 3.5rem !important; }
    .password-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-secondary); cursor: pointer; font-size: 0.9rem;
      padding: 8px 12px; border-radius: 1.5rem;
      transition: var(--transition-smooth); z-index: 2;
      display: flex; align-items: center; gap: 4px;
    }
    .password-toggle:hover { 
      background: rgba(0,247,255,0.1); 
      border-color: var(--neon-cyan); 
      color: var(--neon-cyan); 
    }
    .password-toggle .toggle-label {
      font-size: 0.6rem; text-transform: uppercase; font-weight: 600;
      letter-spacing: 0.5px;
    }
    .password-toggle.showing { 
      background: rgba(0,247,255,0.08); 
      border-color: var(--neon-cyan); 
      color: var(--neon-cyan); 
    }
    
    /* TURNSTILE CONTAINER */
    .turnstile-container { display: flex; justify-content: center; margin-bottom: 1.2rem; min-height: 70px; }
    .turnstile-container iframe { border-radius: 0.8rem !important; }
    
    .quantum-btn { width: 100%; background: var(--gradient-primary); border: none; border-radius: 2rem; padding: 1rem; font-weight: bold; font-size: 1rem; color: white; cursor: pointer; transition: var(--transition-smooth); display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
    .quantum-btn:hover { transform: translateY(-2px); box-shadow: 0 0 20px rgba(0,247,255,0.6); }
    .quantum-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .error-message { background: rgba(255,51,102,0.2); border-left: 3px solid var(--accent-danger); padding: 0.8rem; border-radius: 0.8rem; margin-bottom: 1rem; font-size: 0.85rem; color: #ff88aa; display: none; }
    .success-message { background: rgba(51,255,170,0.2); border-left: 3px solid var(--accent-success); padding: 0.8rem; border-radius: 0.8rem; margin-bottom: 1rem; font-size: 0.85rem; color: #88ffaa; display: none; }
    .quantum-footer { text-align: center; margin-top: 2rem; font-size: 0.7rem; color: var(--text-secondary); }
    .otp-input-group { display: flex; gap: 0.5rem; justify-content: center; }
    
    /* ================ FIXED OTP INPUT STYLES ================ */
    .otp-input {
      width: 50px;
      height: 60px;
      text-align: center;
      font-size: 1.8rem;
      font-weight: 700;
      border-radius: 1rem;
      background: rgba(0, 20, 40, 0.7);
      border: 2px solid rgba(0, 247, 255, 0.25);
      color: #00f7ff;
      font-family: 'JetBrains Mono', monospace;
      transition: all 0.3s ease;
      caret-color: #00f7ff;
      text-shadow: 0 0 20px rgba(0, 247, 255, 0.3);
    }
    
    .otp-input:focus {
      outline: none;
      border-color: #00f7ff;
      box-shadow: 0 0 25px rgba(0, 247, 255, 0.2), inset 0 0 15px rgba(0, 247, 255, 0.05);
      background: rgba(0, 30, 60, 0.8);
    }
    
    .otp-input:hover {
      border-color: rgba(0, 247, 255, 0.5);
    }
    
    /* Highlight when filled */
    .otp-input:not(:placeholder-shown) {
      border-color: #00f7ff;
      background: rgba(0, 40, 80, 0.8);
      box-shadow: 0 0 20px rgba(0, 247, 255, 0.1);
    }
    
    /* Chrome/Safari autofill override */
    .otp-input:-webkit-autofill,
    .otp-input:-webkit-autofill:hover,
    .otp-input:-webkit-autofill:focus {
      -webkit-text-fill-color: #00f7ff;
      -webkit-box-shadow: 0 0 0px 1000px rgba(0, 20, 40, 0.7) inset;
      transition: background-color 5000s ease-in-out 0s;
    }
    /* ======================================================== */
    
    .resend-link { text-align: center; margin-top: 1rem; }
    .resend-link a { color: var(--neon-cyan); text-decoration: none; cursor: pointer; }
    .resend-link a:hover { color: var(--neon-gold); }
    .back-link { text-align: center; margin-top: 1rem; }
    .back-link a { color: var(--text-secondary); text-decoration: none; cursor: pointer; }
    .register-link { text-align: center; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.06); }
    .register-link span { color: var(--text-secondary); font-size: 0.85rem; }
    .register-link a { color: var(--neon-cyan); text-decoration: none; font-weight: 600; margin-left: 0.3rem; transition: var(--transition-smooth); }
    .register-link a:hover { color: var(--neon-gold); }
    .admin-link { text-align: center; margin-top: 0.8rem; font-size: 0.7rem; }
    .admin-link a { color: var(--text-secondary); text-decoration: none; opacity: 0.6; transition: var(--transition-smooth); }
    .admin-link a:hover { color: var(--neon-gold); opacity: 1; }
    .loading-spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    /* OTP Timer */
    .otp-timer { text-align: center; font-size: 0.75rem; color: var(--text-secondary); margin-top: 0.5rem; }
    .otp-timer span { color: var(--neon-gold); font-weight: 600; }
    
    @media (max-width: 600px) { 
      .quantum-card { padding: 1.5rem; } 
      .quantum-header h1 { font-size: 1.6rem; } 
      .otp-input { width: 40px; height: 50px; font-size: 1.5rem; }
      .password-toggle .toggle-label { display: none; }
    }
  </style>
<style>

<body>
  <canvas id="quantum-bg-canvas"></canvas>
  <div class="quantum-grid-overlay"></div>

  <div class="quantum-container">
    <div class="quantum-card">
      <div class="quantum-header">
        <div class="quantum-logo">Q</div>
        <h1>PrimeShieldHub</h1>
        <p>Quantum Access Portal</p>
      </div>

      <!-- Step 1: Email/Password -->
      <div id="step-email">
        <div class="error-message" id="login-error"></div>
        <div class="form-group">
          <label><i class="fas fa-envelope"></i> Email Address</label>
          <input type="email" id="login-email" placeholder="your@email.com" autocomplete="email" spellcheck="false">
        </div>
        <div class="form-group">
          <label><i class="fas fa-key"></i> Password</label>
          <div class="password-wrapper">
            <input type="password" id="login-password" placeholder="Enter your password" autocomplete="current-password">
            <button type="button" class="password-toggle" data-target="login-password" id="passwordToggle" aria-label="Toggle password visibility">
              <i class="fas fa-eye"></i>
              <span class="toggle-label">Show</span>
            </button>
          </div>
        </div>
        
        <!-- Turnstile Widget (loaded dynamically) -->
        <div class="turnstile-container" id="turnstile-container"></div>
        
        <button class="quantum-btn" id="request-otp-btn" disabled>
          <i class="fas fa-arrow-right"></i> Continue to Verification
        </button>
        
        <div class="register-link">
          <span>Don't have an account?</span>
          <a href="/register"><i class="fas fa-user-plus"></i> Create Account</a>
        </div>
        
        <div class="admin-link">
          <a href="/admin-login"><i class="fas fa-shield-alt"></i> Admin Login</a>
        </div>
      </div>

      <!-- Step 2: OTP Verification -->
      <div id="step-otp" style="display: none;">
        <div class="error-message" id="otp-error"></div>
        <div class="success-message" id="otp-success"></div>
        <div class="form-group">
          <label><i class="fas fa-shield-alt"></i> Enter 6-Digit OTP</label>
          <div class="otp-input-group" id="otp-input-group">
            <input type="text" class="otp-input" maxlength="1" data-index="0" inputmode="numeric" pattern="[0-9]" aria-label="OTP digit 1" placeholder="●">
            <input type="text" class="otp-input" maxlength="1" data-index="1" inputmode="numeric" pattern="[0-9]" aria-label="OTP digit 2" placeholder="●">
            <input type="text" class="otp-input" maxlength="1" data-index="2" inputmode="numeric" pattern="[0-9]" aria-label="OTP digit 3" placeholder="●">
            <input type="text" class="otp-input" maxlength="1" data-index="3" inputmode="numeric" pattern="[0-9]" aria-label="OTP digit 4" placeholder="●">
            <input type="text" class="otp-input" maxlength="1" data-index="4" inputmode="numeric" pattern="[0-9]" aria-label="OTP digit 5" placeholder="●">
            <input type="text" class="otp-input" maxlength="1" data-index="5" inputmode="numeric" pattern="[0-9]" aria-label="OTP digit 6" placeholder="●">
          </div>
          <input type="hidden" id="full-otp">
        </div>
        <p style="text-align: center; color: var(--text-secondary); margin-bottom: 0.5rem; font-size: 0.85rem;">
          <i class="fas fa-envelope"></i> A verification code has been sent to your email.
        </p>
        <div class="otp-timer" id="otp-timer">
          <i class="fas fa-clock"></i> Code expires in: <span id="otp-countdown">5:00</span>
        </div>
        <button class="quantum-btn" id="verify-otp-btn" disabled>
          <i class="fas fa-check-circle"></i> Verify & Login
        </button>
        <div class="resend-link">
          <a id="resend-otp"><i class="fas fa-redo"></i> Resend OTP</a>
        </div>
        <div class="back-link">
          <a id="back-to-login"><i class="fas fa-arrow-left"></i> Back to Login</a>
        </div>
      </div>

      <div class="quantum-footer">
        <span>&#9883;&#65039; Protected by Quantum Encryption v9.0</span>
        <br>
        <span style="font-size: 0.6rem; opacity: 0.5;">Secure • Encrypted • Verified</span>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { CONFIG } from '../js/config.js';
    import { auth } from '../js/auth.js';
    import { getDeviceFingerprint } from '../js/sophisticated/fraud-engine/fingerprint.js';

    // ================================================================
    // FIXED: Define STORAGE_KEYS with fallbacks
    // ================================================================
    const API_BASE = CONFIG.apiBase || 'https://api.primeshieldhub.com/api';
    
    // Define storage keys with fallbacks
    const STORAGE_KEYS = {
        TOKEN: CONFIG?.STORAGE_KEYS?.TOKEN || 'psh_auth_token',
        USER: CONFIG?.STORAGE_KEYS?.USER || 'psh_user',
        REFRESH_TOKEN: CONFIG?.STORAGE_KEYS?.REFRESH_TOKEN || 'psh_refresh_token',
        SESSION: CONFIG?.STORAGE_KEYS?.SESSION || 'psh_session'
    };
    
    let currentUserId = null;
    let deviceFingerprint = null;
    let turnstileToken = null;
    let publicConfig = null;
    let otpTimer = null;
    let otpExpiryTime = 0;

    const stepEmail = document.getElementById('step-email');
    const stepOtp = document.getElementById('step-otp');
    const requestOtpBtn = document.getElementById('request-otp-btn');
    const verifyOtpBtn = document.getElementById('verify-otp-btn');
    const resendOtp = document.getElementById('resend-otp');
    const backToLogin = document.getElementById('back-to-login');
    const otpInputs = document.querySelectorAll('.otp-input');
    const fullOtpInput = document.getElementById('full-otp');
    const loginEmail = document.getElementById('login-email');
    const loginPassword = document.getElementById('login-password');
    const passwordToggle = document.getElementById('passwordToggle');
    const otpCountdown = document.getElementById('otp-countdown');

    // ==================== PASSWORD TOGGLE - ENHANCED ====================
    let isPasswordVisible = false;
    
    passwordToggle.addEventListener('click', function() {
      const input = document.getElementById(this.getAttribute('data-target'));
      const icon = this.querySelector('i');
      const label = this.querySelector('.toggle-label');
      
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
        label.textContent = 'Hide';
        this.classList.add('showing');
        isPasswordVisible = true;
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
        label.textContent = 'Show';
        this.classList.remove('showing');
        isPasswordVisible = false;
      }
    });

    // Keyboard shortcut: Ctrl+Shift+P to toggle password visibility
    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.shiftKey && (e.key === 'p' || e.key === 'P')) {
        e.preventDefault();
        passwordToggle.click();
      }
    });

    // ==================== LOAD PUBLIC CONFIG & TURNSTILE ====================
    async function loadPublicConfig() {
      try {
        const res = await fetch(`${API_BASE}/config/public`);
        if (res.ok) {
          publicConfig = await res.json();
        }
      } catch (e) {
        console.warn('Failed to load public config:', e);
      }

      // Load Turnstile dynamically with the site key from API
      if (publicConfig && publicConfig.turnstileSiteKey) {
        // Remove any existing Turnstile script
        const existingScript = document.querySelector('script[src*="turnstile"]');
        if (existingScript) existingScript.remove();

        const script = document.createElement('script');
        script.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
        script.async = true;
        script.defer = true;
        script.onload = function() {
          // Render Turnstile widget
          if (window.turnstile) {
            try {
              window.turnstile.render('#turnstile-container', {
                sitekey: publicConfig.turnstileSiteKey,
                theme: 'dark',
                size: 'normal',
                callback: function(token) {
                  turnstileToken = token;
                  requestOtpBtn.disabled = false;
                  requestOtpBtn.innerHTML = '<i class="fas fa-arrow-right"></i> Continue to Verification';
                },
                'expired-callback': function() {
                  turnstileToken = null;
                  requestOtpBtn.disabled = true;
                  requestOtpBtn.innerHTML = '<i class="fas fa-arrow-right"></i> Verify Security Challenge';
                },
                'error-callback': function() {
                  console.warn('Turnstile verification failed');
                  turnstileToken = null;
                  requestOtpBtn.disabled = true;
                  requestOtpBtn.innerHTML = '<i class="fas fa-arrow-right"></i> Verify Security Challenge';
                }
              });
            } catch (e) {
              console.error('Turnstile render error:', e);
              requestOtpBtn.disabled = false;
            }
          }
        };
        script.onerror = function() {
          console.warn('Failed to load Turnstile, allowing login without it');
          requestOtpBtn.disabled = false;
        };
        document.head.appendChild(script);
      } else {
        console.warn('Turnstile site key not found in config');
        requestOtpBtn.disabled = false;
      }
    }

    // ==================== FINGERPRINT ====================
    async function getFingerprint() {
      if (deviceFingerprint) return deviceFingerprint;
      try {
        deviceFingerprint = await getDeviceFingerprint();
        return deviceFingerprint;
      } catch (e) {
        // Fallback fingerprint
        const components = [
          navigator.userAgent, 
          screen.width, 
          screen.height, 
          screen.colorDepth,
          navigator.language,
          Intl.DateTimeFormat().resolvedOptions().timeZone,
          new Date().getTimezoneOffset()
        ].join('|');
        const encoder = new TextEncoder();
        const data = encoder.encode(components);
        const hash = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 64);
      }
    }

    function showMessage(elementId, message, isError) {
      const el = document.getElementById(elementId);
      if (!el) return;
      el.textContent = message;
      el.style.display = 'block';
      
      // Auto-hide after 5 seconds for errors, 3 seconds for success
      const duration = isError !== false ? 5000 : 3000;
      setTimeout(function() { 
        el.style.display = 'none'; 
      }, duration);
    }

    async function apiRequest(endpoint, options) {
      options = options || {};
      const fingerprint = await getFingerprint();
      const fullEndpoint = endpoint.startsWith('/api/') ? endpoint : '/api' + endpoint;
      const url = endpoint.startsWith('http') ? endpoint : API_BASE + fullEndpoint;
      
      const response = await fetch(url, Object.assign({}, options, {
        headers: Object.assign({
          'Content-Type': 'application/json',
          'x-device-fingerprint': fingerprint
        }, options.headers || {}),
        credentials: 'include'
      }));
      
      const data = await response.json().catch(function() { return {}; });
      
      if (!response.ok) {
        throw new Error(data.error || data.message || 'API error: ' + response.status);
      }
      return data;
    }

    // ==================== OTP INPUTS ====================
    otpInputs.forEach(function(input, index) {
      input.addEventListener('input', function(e) {
        const value = e.target.value.replace(/[^0-9]/g, '');
        e.target.value = value;
        if (value && index < otpInputs.length - 1) {
          otpInputs[index + 1].focus();
        }
        updateFullOtp();
      });
      
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          otpInputs[index - 1].focus();
          otpInputs[index - 1].select();
        }
        // Allow paste with Ctrl+V
        if (e.key === 'v' && (e.ctrlKey || e.metaKey)) {
          // Let paste handler do its job
          return;
        }
      });
      
      input.addEventListener('paste', function(e) {
        e.preventDefault();
        const paste = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '').slice(0, 6);
        paste.split('').forEach(function(char, i) {
          if (otpInputs[i]) otpInputs[i].value = char;
        });
        // Focus the last filled or first empty
        const lastFilled = Math.min(paste.length, otpInputs.length) - 1;
        if (lastFilled >= 0) {
          otpInputs[Math.min(lastFilled + 1, otpInputs.length - 1)].focus();
        }
        updateFullOtp();
      });
      
      // Auto-advance on focus
      input.addEventListener('focus', function() {
        this.select();
      });
    });

    function updateFullOtp() {
      const otp = Array.from(otpInputs).map(function(i) { return i.value; }).join('');
      fullOtpInput.value = otp;
      verifyOtpBtn.disabled = otp.length !== 6;
    }

    function clearOtpInputs() {
      otpInputs.forEach(function(i) { i.value = ''; });
      fullOtpInput.value = '';
      verifyOtpBtn.disabled = true;
    }

    // ==================== OTP TIMER ====================
    function startOtpTimer(expirySeconds = 300) {
      otpExpiryTime = Date.now() + (expirySeconds * 1000);
      updateOtpTimerDisplay();
      
      if (otpTimer) clearInterval(otpTimer);
      otpTimer = setInterval(updateOtpTimerDisplay, 1000);
    }

    function updateOtpTimerDisplay() {
      const remaining = Math.max(0, Math.floor((otpExpiryTime - Date.now()) / 1000));
      const minutes = Math.floor(remaining / 60);
      const seconds = remaining % 60;
      
      otpCountdown.textContent = `minutes:{seconds.toString().padStart(2, '0')}`;
      
      // Change color when low on time
      if (remaining < 30) {
        otpCountdown.style.color = 'var(--accent-danger)';
      } else if (remaining < 60) {
        otpCountdown.style.color = 'var(--accent-warning)';
      } else {
        otpCountdown.style.color = 'var(--neon-gold)';
      }
      
      if (remaining <= 0) {
        clearInterval(otpTimer);
        otpCountdown.textContent = 'Expired';
        otpCountdown.style.color = 'var(--accent-danger)';
        // Disable verify button
        verifyOtpBtn.disabled = true;
      }
    }

    // ==================== REQUEST OTP ====================
    async function handleRequestOtp() {
      const email = loginEmail.value.trim();
      const password = loginPassword.value;
      
      if (!email || !password) {
        showMessage('login-error', 'Please enter your email and password');
        return;
      }
      
      // Basic email validation
      if (!email.includes('@') || !email.includes('.')) {
        showMessage('login-error', 'Please enter a valid email address');
        return;
      }
      
      // Check Turnstile if available
      if (publicConfig && publicConfig.turnstileSiteKey && !turnstileToken) {
        showMessage('login-error', 'Please complete the security verification');
        return;
      }
      
      requestOtpBtn.disabled = true;
      requestOtpBtn.innerHTML = '<span class="loading-spinner"></span> Sending OTP...';
      
      try {
        const requestBody = { 
          email: email, 
          password: password,
          fingerprint: await getFingerprint()
        };
        
        // Include Turnstile token if available
        if (turnstileToken) {
          requestBody.turnstileToken = turnstileToken;
        }
        
        const data = await apiRequest('/auth/request-otp', {
          method: 'POST',
          body: JSON.stringify(requestBody)
        });
        
        currentUserId = data.userId;
        
        sessionStorage.setItem('login_email', email);
        sessionStorage.setItem('login_password', btoa(password));
        
        showMessage('otp-success', '✅ OTP sent to your email!', false);
        
        stepEmail.style.display = 'none';
        stepOtp.style.display = 'block';
        
        // Clear and focus OTP inputs
        clearOtpInputs();
        setTimeout(() => otpInputs[0].focus(), 300);
        
        // Start timer (5 minutes default)
        startOtpTimer(300);
        
      } catch (err) {
        showMessage('login-error', err.message);
        // Reset Turnstile on error
        if (window.turnstile) {
          try { window.turnstile.reset(); } catch(e) {}
        }
        turnstileToken = null;
        requestOtpBtn.disabled = false;
        requestOtpBtn.innerHTML = '<i class="fas fa-arrow-right"></i> Continue to Verification';
      } finally {
        requestOtpBtn.disabled = false;
        requestOtpBtn.innerHTML = '<i class="fas fa-arrow-right"></i> Continue to Verification';
      }
    }

    // ==================== VERIFY OTP ====================
    async function handleVerifyOtp() {
      const otp = fullOtpInput.value;
      
      if (otp.length !== 6) {
        showMessage('otp-error', 'Please enter the complete 6-digit OTP');
        return;
      }
      
      if (!currentUserId) {
        showMessage('otp-error', 'Session expired. Please go back and login again.');
        return;
      }
      
      verifyOtpBtn.disabled = true;
      verifyOtpBtn.innerHTML = '<span class="loading-spinner"></span> Verifying...';
      
      try {
        const fingerprint = await getFingerprint();
        
        const data = await apiRequest('/auth/verify-otp', {
          method: 'POST',
          body: JSON.stringify({ 
            userId: currentUserId, 
            otp: otp, 
            fingerprint: fingerprint 
          })
        });
        
        showMessage('otp-success', '✅ Authentication successful! Redirecting...', false);
        
        // ============================================================
        // FIXED: Save token using direct keys with fallbacks
        // ============================================================
        if (data.token && data.user) {
          // Direct localStorage save using our defined keys
          localStorage.setItem(STORAGE_KEYS.TOKEN, data.token);
          localStorage.setItem(STORAGE_KEYS.USER, JSON.stringify(data.user));
          
          // Also save to session storage for redundancy
          sessionStorage.setItem(STORAGE_KEYS.TOKEN, data.token);
          sessionStorage.setItem(STORAGE_KEYS.USER, JSON.stringify(data.user));
          
          // Save using unified auth if available
          try {
            if (typeof auth !== 'undefined' && auth.setToken && auth.setUser) {
              auth.setToken(data.token);
              auth.setUser(data.user);
            }
          } catch (e) {
            console.warn('Auth module save failed, using legacy storage');
          }
          
          // Save to AuthStorage if available
          if (window.AuthStorage && typeof window.AuthStorage.saveSession === 'function') {
            try {
              window.AuthStorage.saveSession(data.token, data.user);
            } catch(e) {}
          }
        }
        
        sessionStorage.removeItem('login_email');
        sessionStorage.removeItem('login_password');
        
        // Clear timer
        if (otpTimer) {
          clearInterval(otpTimer);
          otpTimer = null;
        }
        
        // ============================================================
        // FIXED: Dynamic redirect based on role with redirect param
        // ============================================================
        const role = data.role || (data.user && data.user.role) || 'customer';
        const redirectParam = new URLSearchParams(window.location.search).get('redirect');
        
        // Role-based redirect map
        const roleMap = {
          'admin': '/admin',
          'staff': '/staff',
          'franchise': '/franchise',
          'reseller': '/reseller'
        };
        
        // Use redirect param if provided, otherwise role-based
        let redirectUrl = redirectParam || roleMap[role] || '/';
        
        // Ensure redirect is relative and safe
        if (redirectUrl.startsWith('http') && !redirectUrl.includes(window.location.hostname)) {
          redirectUrl = '/';
        }
        
        setTimeout(function() {
          window.location.href = redirectUrl;
        }, 800);
        
      } catch (err) {
        showMessage('otp-error', err.message);
        verifyOtpBtn.disabled = false;
        verifyOtpBtn.innerHTML = '<i class="fas fa-check-circle"></i> Verify & Login';
      }
    }

    // ==================== RESEND OTP ====================
    async function handleResendOtp() {
      const email = sessionStorage.getItem('login_email') || loginEmail.value.trim();
      const password = sessionStorage.getItem('login_password') 
        ? atob(sessionStorage.getItem('login_password'))
        : loginPassword.value;
      
      if (!email || !password) {
        showMessage('otp-error', 'Session expired. Please go back to login.');
        return;
      }
      
      resendOtp.style.pointerEvents = 'none';
      resendOtp.style.opacity = '0.5';
      resendOtp.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
      
      try {
        const data = await apiRequest('/auth/request-otp', {
          method: 'POST',
          body: JSON.stringify({ 
            email: email, 
            password: password,
            fingerprint: await getFingerprint()
          })
        });
        currentUserId = data.userId;
        clearOtpInputs();
        showMessage('otp-success', '✅ New OTP sent to your email!', false);
        otpInputs[0].focus();
        startOtpTimer(300);
      } catch (err) {
        showMessage('otp-error', err.message);
      } finally {
        resendOtp.style.pointerEvents = '';
        resendOtp.style.opacity = '';
        resendOtp.innerHTML = '<i class="fas fa-redo"></i> Resend OTP';
      }
    }

    function handleBackToLogin() {
      stepEmail.style.display = 'block';
      stepOtp.style.display = 'none';
      clearOtpInputs();
      currentUserId = null;
      
      if (otpTimer) {
        clearInterval(otpTimer);
        otpTimer = null;
      }
      
      const savedEmail = sessionStorage.getItem('login_email');
      if (savedEmail) loginEmail.value = savedEmail;
    }

    // ==================== EVENT LISTENERS ====================
    requestOtpBtn.addEventListener('click', handleRequestOtp);
    verifyOtpBtn.addEventListener('click', handleVerifyOtp);
    resendOtp.addEventListener('click', handleResendOtp);
    backToLogin.addEventListener('click', handleBackToLogin);

    // Enter key support
    loginPassword.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleRequestOtp();
      }
    });

    loginEmail.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        loginPassword.focus();
      }
    });

    // OTP input - enter key triggers verification
    document.getElementById('otp-input-group').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (fullOtpInput.value.length === 6) {
          handleVerifyOtp();
        }
      }
    });

    // ==================== INIT ====================
    async function init() {
      // Load public config first (Turnstile key, Paystack key, etc.)
      await loadPublicConfig();
      
      // Restore saved email if any
      const savedEmail = sessionStorage.getItem('login_email');
      if (savedEmail) loginEmail.value = savedEmail;
      
      // ============================================================
      // FIXED: Check multiple possible token locations
      // ============================================================
      const token = localStorage.getItem(STORAGE_KEYS.TOKEN) || 
                    localStorage.getItem('psh_auth_token') || 
                    localStorage.getItem('auth_token') ||
                    sessionStorage.getItem(STORAGE_KEYS.TOKEN) ||
                    sessionStorage.getItem('psh_auth_token');
      
      const userStr = localStorage.getItem(STORAGE_KEYS.USER) || 
                      localStorage.getItem('psh_user') || 
                      localStorage.getItem('user') ||
                      sessionStorage.getItem(STORAGE_KEYS.USER) ||
                      sessionStorage.getItem('psh_user');
      
      if (token && userStr) {
        try {
          const userData = JSON.parse(userStr);
          // Redirect to appropriate dashboard
          const role = userData.role || 'customer';
          const roleMap = {
            'admin': '/admin',
            'staff': '/staff',
            'franchise': '/franchise',
            'reseller': '/reseller'
          };
          window.location.href = roleMap[role] || '/';
          return;
        } catch(e) {
          console.warn('Failed to parse user data:', e);
        }
      }
      
      // Initialize fingerprint
      getFingerprint().catch(function(e) { console.warn('Fingerprint init failed:', e); });
      
      console.log('🚀 PrimeShieldHub Quantum Access Portal v9.1');
      console.log('🔐 Security: AES-256-GCM | SHA-256 | CSRF Protected');
      console.log('🖥️  Password toggle: Click the eye icon or press Ctrl+Shift+P');
      console.log('📦 Using unified config from ../js/config.js');
      console.log('📦 Storage keys:', STORAGE_KEYS);
    }

    init();

    // ==================== 3D BACKGROUND ====================
    const canvas = document.getElementById('quantum-bg-canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 0);
    
    const geometry = new THREE.TorusKnotGeometry(1.5, 0.4, 200, 32, 3, 4);
    const material = new THREE.MeshStandardMaterial({
      color: 0x00f7ff, emissive: 0x0066aa, emissiveIntensity: 0.6,
      metalness: 0.8, roughness: 0.2, wireframe: false
    });
    const knot = new THREE.Mesh(geometry, material);
    scene.add(knot);
    
    const wireMat = new THREE.MeshBasicMaterial({ color: 0xff66cc, wireframe: true, transparent: true, opacity: 0.3 });
    const wireKnot = new THREE.Mesh(geometry, wireMat);
    scene.add(wireKnot);
    
    const starGeo = new THREE.BufferGeometry();
    const starPos = [];
    for (let i = 0; i < 1500; i++) {
      starPos.push((Math.random() - 0.5) * 200);
      starPos.push((Math.random() - 0.5) * 100);
      starPos.push((Math.random() - 0.5) * 100 - 50);
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(starPos), 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.2, transparent: true, opacity: 0.6 }));
    scene.add(stars);
    
    scene.add(new THREE.AmbientLight(0x222222));
    const light1 = new THREE.PointLight(0x00ffff, 1); light1.position.set(5, 5, 5); scene.add(light1);
    const light2 = new THREE.PointLight(0xff66cc, 0.8); light2.position.set(-3, 2, -4); scene.add(light2);
    
    camera.position.z = 5;
    let time = 0;
    function animate() {
      requestAnimationFrame(animate);
      time += 0.01;
      knot.rotation.x = time * 0.5;
      knot.rotation.y = time * 0.8;
      wireKnot.rotation.x = time * 0.5;
      wireKnot.rotation.y = time * 0.8;
      stars.rotation.y = time * 0.05;
      renderer.render(scene, camera);
    }
    animate();
    
    window.addEventListener('resize', function() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
