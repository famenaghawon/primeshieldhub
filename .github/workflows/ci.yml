name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate schema & secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate db/schema.sql parses
        run: |
          # D1 uses uuid() which standard sqlite3 doesn't have — neutralize it
          # so we can validate syntax without a live D1 connection
          sed -E 's/DEFAULT \(?uuid\(\)\)?/DEFAULT NULL/g; s/DEFAULT uuid\(\)/DEFAULT NULL/g' \
            db/schema.sql > /tmp/schema.sql
          if [ ! -s /tmp/schema.sql ]; then
            echo "ERROR: schema.sql is empty or missing"
            exit 1
          fi
          sqlite3 :memory: < /tmp/schema.sql
          echo "✅ schema.sql is valid SQL"

      - name: Check for hardcoded secrets
        run: |
          # Fail if any live-looking token appears in tracked files
          MATCHES=$(git grep -inE \
            'r8_[A-Za-z0-9]{30,}|sk_live_[A-Za-z0-9]{20,}|sk_test_[A-Za-z0-9]{20,}|FLWSECK[_-][A-Za-z0-9]{20,}' \
            -- . ':(exclude)*.md' ':(exclude)*.example' \
            || true)
          if [ -n "$MATCHES" ]; then
            echo "❌ Found potential secrets in tracked files:"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ No hardcoded secrets detected"

      - name: Check for nvm/ regressions
        run: |
          if git ls-files | grep -q '^nvm/'; then
            echo "❌ nvm/ has reappeared in git. This should never be tracked."
            git ls-files | grep '^nvm/' | head -5
            exit 1
          fi
          echo "✅ nvm/ not tracked"

      - name: Check repo size sanity
        run: |
          SIZE_MB=$(git count-objects -vH | grep size-pack | awk '{print $2}' | sed 's/MiB//')
          echo "Pack size: ${SIZE_MB} MiB"
          if [ "${SIZE_MB%.*}" -gt 100 ]; then
            echo "❌ Repo pack size exceeded 100 MB (${SIZE_MB} MiB)"
            echo "Investigate large files in history:"
            git rev-list --objects --all | git cat-file --batch-check='%(objectsize) %(rest)' | sort -rn | head -10
            exit 1
          fi
          echo "✅ Repo pack size OK"
